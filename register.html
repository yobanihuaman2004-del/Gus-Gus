<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gus Gus - Registro de Cuenta</title>
  <style>
    :root {
      --bg-color: #F4EFEA;
      --card-bg: #FFFFFF;
      --primary-color: #3A272D;
      --accent-color: #8C6551;
      --text-main: #231B1E;
      --text-muted: #6E6366;
      --border-color: #E2DAD5;
      --input-bg: #FAF7F5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .app-card {
      background: var(--card-bg);
      padding: 36px 24px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(58, 39, 45, 0.05);
      max-width: 420px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(226, 218, 213, 0.6);
    }

    .brand-title {
      color: var(--primary-color);
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .brand-subtitle {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      font-size: 15px;
      color: var(--text-main);
      outline: none;
    }

    .btn-submit {
      width: 100%;
      padding: 16px;
      background-color: var(--primary-color);
      color: #FFFFFF;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }

    .divider {
      margin: 24px 0 16px 0;
      border-top: 1px solid var(--border-color);
    }

    .btn-secondary {
      display: block;
      width: 100%;
      padding: 14px;
      background-color: transparent;
      color: var(--accent-color);
      border: 2px solid var(--accent-color);
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      box-sizing: border-box;
    }

    #mensaje {
      margin-top: 16px;
      font-size: 14px;
      font-weight: 600;
    }
    .error { color: #B33A3A; }
    .exito { color: #3A7A56; }
  </style>
</head>
<body>

  <div class="app-card">
    <h1 class="brand-title">Gus Gus</h1>
    <p class="brand-subtitle">Completa tus datos para crear tu cuenta en segundos.</p>

    <form id="formRegistro">
      <div class="form-group">
        <label>Nombre Completo</label>
        <input type="text" id="regNombre" placeholder="Tu nombre y apellido" required>
      </div>

      <div class="form-group">
        <label>Correo Electrónico</label>
        <input type="email" id="regEmail" placeholder="tu@correo.com" required>
      </div>

      <div class="form-group">
        <label>Número de DNI</label>
        <input type="text" id="regDni" placeholder="Ingresa tus 8 dígitos" maxlength="8" pattern="[0-9]{8}" required>
      </div>

      <div class="form-group">
        <label>Crear Contraseña</label>
        <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres" minlength="6" required>
      </div>

      <button type="submit" class="btn-submit">Crear Mi Cuenta</button>
    </form>

    <div id="mensaje"></div>

    <div class="divider"></div>

    <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 12px;">¿Ya tienes una cuenta?</p>
    <a href="/" class="btn-secondary">Volver al Inicio de Sesión</a>
  </div>

  <script>
    document.getElementById('formRegistro').onsubmit = async function(e) {
      e.preventDefault();
      const msg = document.getElementById('mensaje');
      msg.textContent = "Registrando usuario...";
      msg.className = "";

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nombre: document.getElementById('regNombre').value,
            email: document.getElementById('regEmail').value,
            dni: document.getElementById('regDni').value,
            password: document.getElementById('regPassword').value
          })
        });
        const data = await res.json();
        if (res.ok) {
          msg.textContent = "¡Cuenta creada con éxito! Redirigiendo...";
          msg.className = "exito";
          setTimeout(() => { window.location.href = "/"; }, 1500);
        } else {
          msg.textContent = data.error || "Error al registrar cuenta";
          msg.className = "error";
        }
      } catch (err) {
        msg.textContent = "Error de conexión con el servidor.";
        msg.className = "error";
      }
    };
  </script>

</body>
</html>
