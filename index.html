<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gus Gus - Acceso Principal</title>
  <meta name="description" content="Gus Gus - Plataforma segura de intermediación con diseño vanguardista.">
  <style>
    :root {
      --bg-color: #F4EFEA;
      --card-bg: #FFFFFF;
      --primary-color: #3A272D;
      --primary-hover: #2B1C21;
      --accent-color: #8C6551;
      --text-main: #231B1E;
      --text-muted: #6E6366;
      --border-color: #E2DAD5;
      --input-bg: #FAF7F5;
      --focus-ring: #8C6551;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .app-card {
      background: var(--card-bg);
      padding: 40px 28px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(58, 39, 45, 0.05);
      max-width: 420px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(226, 218, 213, 0.6);
    }

    .brand-title {
      color: var(--primary-color);
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .brand-subtitle {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 8px;
      letter-spacing: 0.2px;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      font-size: 15px;
      color: var(--text-main);
      outline: none;
      transition: all 0.25s ease;
    }

    .form-group input:focus {
      border-color: var(--focus-ring);
      background-color: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(140, 101, 81, 0.15);
    }

    .btn-submit {
      width: 100%;
      padding: 16px;
      background-color: var(--primary-color);
      color: #FFFFFF;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background-color 0.25s ease, transform 0.1s ease;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    .btn-submit:active {
      transform: scale(0.99);
    }

    .footer-text {
      margin-top: 24px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .footer-text button {
      background: none;
      border: none;
      color: var(--accent-color);
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      text-decoration: underline;
    }

    #mensaje {
      margin-top: 18px;
      font-size: 14px;
      font-weight: 600;
      min-height: 20px;
    }

    .error { color: #B33A3A; }
    .exito { color: #3A7A56; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="app-card">
    <h1 class="brand-title">Gus Gus</h1>
    <p class="brand-subtitle" id="formSubtitle">Ingresa a tu cuenta para operar de forma segura en nuestra plataforma intermediaria.</p>

    <!-- FORMULARIO DE INICIO DE SESIÓN -->
    <form id="loginForm">
      <div class="form-group">
        <label for="loginEmail">Correo Electrónico</label>
        <input type="email" id="loginEmail" placeholder="tu@correo.com" required>
      </div>

      <div class="form-group">
        <label for="loginDni">Número de DNI</label>
        <input type="text" id="loginDni" placeholder="Ingresa tus 8 dígitos" maxlength="8" pattern="[0-9]{8}" required>
      </div>

      <div class="form-group">
        <label for="loginPassword">Contraseña</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-submit">Ingresar a Gus Gus</button>
    </form>

    <!-- FORMULARIO DE REGISTRO (OCULTO POR DEFECTO) -->
    <form id="registerForm" class="hidden">
      <div class="form-group">
        <label for="regNombre">Nombre Completo</label>
        <input type="text" id="regNombre" placeholder="Tu nombre y apellido" required>
      </div>

      <div class="form-group">
        <label for="regEmail">Correo Electrónico</label>
        <input type="email" id="regEmail" placeholder="tu@correo.com" required>
      </div>

      <div class="form-group">
        <label for="regDni">Número de DNI</label>
        <input type="text" id="regDni" placeholder="Ingresa tus 8 dígitos" maxlength="8" pattern="[0-9]{8}" required>
      </div>

      <div class="form-group">
        <label for="regPassword">Crear Contraseña</label>
        <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres" minlength="6" required>
      </div>

      <button type="submit" class="btn-submit">Crear Mi Cuenta</button>
    </form>

    <div id="mensaje"></div>

    <div class="footer-text" id="footerToggle">
      <span id="toggleQuestion">¿No tienes una cuenta?</span> 
      <button id="toggleBtn" type="button">Regístrate aquí</button>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const formSubtitle = document.getElementById('formSubtitle');
    const toggleBtn = document.getElementById('toggleBtn');
    const toggleQuestion = document.getElementById('toggleQuestion');
    const mensajeDiv = document.getElementById('mensaje');

    let esModoRegistro = false;

    // Cambiar entre Login y Registro
    toggleBtn.addEventListener('click', () => {
      esModoRegistro = !esModoRegistro;
      mensajeDiv.textContent = "";

      if (esModoRegistro) {
        loginForm.classList.add('hidden');
        registerForm.classList.remove('hidden');
        formSubtitle.textContent = "Crea tu cuenta en segundos para empezar a usar la plataforma.";
        toggleQuestion.textContent = "¿Ya tienes una cuenta?";
        toggleBtn.textContent = "Inicia sesión aquí";
      } else {
        registerForm.classList.add('hidden');
        loginForm.classList.remove('hidden');
        formSubtitle.textContent = "Ingresa a tu cuenta para operar de forma segura en nuestra plataforma intermediaria.";
        toggleQuestion.textContent = "¿No tienes una cuenta?";
        toggleBtn.textContent = "Regístrate aquí";
      }
    });

    // Enviar Login
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      mensajeDiv.textContent = "Verificando...";
      mensajeDiv.className = "";

      const email = document.getElementById('loginEmail').value;
      const dni = document.getElementById('loginDni').value;
      const password = document.getElementById('loginPassword').value;

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, dni, password })
        });
        const data = await response.json();

        if (response.ok) {
          mensajeDiv.textContent = "¡Inicio de sesión exitoso!";
          mensajeDiv.className = "exito";
        } else {
          mensajeDiv.textContent = data.error || "Error al iniciar sesión";
          mensajeDiv.className = "error";
        }
      } catch (err) {
        mensajeDiv.textContent = "No se pudo conectar con el servidor.";
        mensajeDiv.className = "error";
      }
    });

    // Enviar Registro
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      mensajeDiv.textContent = "Registrando...";
      mensajeDiv.className = "";

      const nombre = document.getElementById('regNombre').value;
      const email = document.getElementById('regEmail').value;
      const dni = document.getElementById('regDni').value;
      const password = document.getElementById('regPassword').value;

      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre, email, dni, password })
        });
        const data = await response.json();

        if (response.ok) {
          mensajeDiv.textContent = "¡Cuenta creada con éxito! Ya puedes iniciar sesión.";
          mensajeDiv.className = "exito";
          setTimeout(() => toggleBtn.click(), 2000);
        } else {
          mensajeDiv.textContent = data.error || "Error al crear la cuenta";
          mensajeDiv.className = "error";
        }
      } catch (err) {
        mensajeDiv.textContent = "No se pudo conectar con el servidor.";
        mensajeDiv.className = "error";
      }
    });
  </script>

</body>
</html>
