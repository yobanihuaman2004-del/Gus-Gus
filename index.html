<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GG - Plataforma de Intermediación</title>
  <style>
    :root {
      --wine-main: #58111a;
      --wine-dark: #3b0910;
      --wine-card: #450c14;
      --wine-light: #721925;
      --white: #ffffff;
      --off-white: #f8f1f2;
      --white-muted: #e0cfd2;
      --border-white: 1px solid rgba(255, 255, 255, 0.3);
      --border-white-strong: 2px solid #ffffff;
    }

    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }

    input, textarea, select {
      -webkit-user-select: text !important;
      -moz-user-select: text !important;
      -ms-user-select: text !important;
      user-select: text !important;
    }

    body {
      background-color: var(--wine-dark);
      color: var(--white);
      font-family: system-ui, -apple-system, Roboto, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      -webkit-touch-callout: none;
    }

    .app-container {
      width: 100%;
      max-width: 520px;
      background-color: var(--wine-main);
      min-height: 100vh;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.95);
      position: relative;
      padding-bottom: 50px;
      border-left: var(--border-white);
      border-right: var(--border-white);
    }

    .gg-header {
      background: linear-gradient(135deg, var(--wine-dark) 0%, var(--wine-main) 100%);
      padding: 24px 20px 18px 20px;
      border-bottom: var(--border-white-strong);
    }

    .logo-badge-gg {
      font-size: 2.5rem;
      font-weight: 900;
      color: var(--white);
      letter-spacing: 3px;
      border: 3px solid var(--white);
      padding: 4px 18px;
      border-radius: 10px;
      display: inline-block;
      background: var(--wine-dark);
    }

    .card-section {
      background: var(--wine-card);
      border: var(--border-white);
      border-radius: 14px;
      margin: 20px 16px;
      padding: 22px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--white-muted);
      margin-bottom: 4px;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 13px;
      background: var(--wine-dark);
      border: var(--border-white);
      border-radius: 8px;
      color: var(--white);
      margin-bottom: 14px;
      font-size: 1rem;
      outline: none;
    }

    input:focus {
      border-color: var(--white);
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
    }

    .btn-gg {
      background: var(--white);
      color: var(--wine-dark);
      border: none;
      padding: 14px 20px;
      border-radius: 25px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      margin: 10px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: block;
    }

    .btn-gg:active {
      background: var(--off-white);
      transform: scale(0.99);
    }

    .btn-outline-white {
      background: transparent;
      color: var(--white);
      border: 1.5px solid var(--white);
    }

    .btn-action-small {
      padding: 8px 12px;
      font-size: 0.8rem;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      border: 1px solid var(--white);
      margin-top: 6px;
    }

    .balance-card {
      background: var(--wine-card);
      border: var(--border-white);
      border-radius: 16px;
      margin: 20px 16px;
      padding: 22px;
      text-align: center;
    }

    .balance-amount {
      font-size: 2.6rem;
      font-weight: 800;
      color: var(--white);
      margin: 10px 0;
    }

    .chat-box {
      background: var(--wine-dark);
      border: var(--border-white);
      border-radius: 12px;
      height: 280px;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg-bubble {
      max-width: 82%;
      padding: 9px 14px;
      border-radius: 15px;
      font-size: 0.88rem;
      border: 1px solid rgba(255,255,255,0.15);
    }

    .msg-sent { background: var(--wine-light); color: var(--white); align-self: flex-end; }
    .msg-received { background: rgba(255, 255, 255, 0.12); color: var(--white); align-self: flex-start; }
    .msg-system { background: #fff; color: var(--wine-dark); align-self: center; font-weight: bold; border-radius: 8px; text-align: center; }

    .chat-img-preview { max-width: 100%; border-radius: 8px; margin-top: 6px; border: 1px solid var(--white); }
    .hidden { display: none !important; }
    .search-results { background: var(--wine-dark); border: var(--border-white); border-radius: 8px; margin-top: 5px; max-height: 120px; overflow-y: auto; }
    .search-item { padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,0.1); cursor: pointer; font-size: 0.9rem; }
    .link-toggle { color: var(--white); text-decoration: underline; cursor: pointer; font-size: 0.9rem; font-weight: bold; }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- AUTENTICACIÓN DIRECTA -->
    <div id="authSection" class="card-section" style="margin-top: 30px; border: var(--border-white-strong);">
      <div style="text-align: center; margin-bottom: 25px;">
        <div class="logo-badge-gg">GG</div>
        <p style="color: var(--white-muted); font-size: 0.9rem; margin-top: 10px; font-weight: bold; letter-spacing: 1px;">SISTEMA DE INTERMEDIACIÓN & CUSTODIA</p>
      </div>

      <!-- FORMULARIO DE INICIO DE SESIÓN DIRECTO -->
      <form id="loginForm" onsubmit="ejecutarLogin(event)">
        <h3 style="border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 8px; margin-top:0;">Iniciar Sesión</h3>
        
        <label>Número de DNI:</label>
        <input type="text" id="loginDni" placeholder="Ej. 12345678" value="12345678" maxlength="8">

        <label>Gmail o Teléfono:</label>
        <input type="text" id="loginEmail" placeholder="usuario@gmail.com" value="admin@gusgus.com">
        
        <label>Contraseña:</label>
        <input type="password" id="loginPass" placeholder="******" value="admin123">
        
        <button type="submit" class="btn-gg">INGRESAR A LA APP</button>

        <div style="text-align: center; margin-top: 15px;">
          <span class="link-toggle" onclick="toggleAuthView('register')">¿No tienes cuenta? Regístrate aquí</span>
        </div>
      </form>

      <!-- FORMULARIO DE REGISTRO DIRECTO -->
      <form id="viewRegister" class="hidden" onsubmit="ejecutarRegistro(event)">
        <h3 style="border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 8px; margin-top:0;">Crear Cuenta Nueva</h3>
        
        <label>Número de DNI:</label>
        <input type="text" id="regDni" placeholder="Ej. 73456789" maxlength="8">

        <label>Nombre Completo / Usuario:</label>
        <input type="text" id="regName" placeholder="Tu Nombre y Apellido">

        <label>Correo Electrónico (Gmail):</label>
        <input type="email" id="regEmail" placeholder="usuario@gmail.com">

        <label>Teléfono Celular:</label>
        <input type="text" id="regPhone" placeholder="Ej. 912345678">

        <label>Contraseña:</label>
        <input type="password" id="regPass" placeholder="Crea tu contraseña">

        <button type="submit" class="btn-gg">REGISTRAR MI CUENTA</button>

        <div style="text-align: center; margin-top: 15px;">
          <span class="link-toggle" onclick="toggleAuthView('login')">¿Ya tienes cuenta? Inicia sesión</span>
        </div>
      </form>

      <!-- VERIFICACIÓN DE CÓDIGO -->
      <div id="viewVerify" class="hidden">
        <h3 style="border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 8px; margin-top:0;">Verificar Código</h3>
        <p style="font-size: 0.85rem; color: var(--white-muted);">Ingresa el código de 6 dígitos generado:</p>
        <input type="text" id="verifyCode" placeholder="Código (Ej: 123456)" maxlength="6">
        <p id="demoCodeNotice" style="color: var(--white); font-size: 0.85rem; font-weight: bold; text-align: center;"></p>
        <button type="button" class="btn-gg" onclick="confirmarVerificacion()">CONFIRMAR E INGRESAR</button>
      </div>

      <p id="authStatus" style="color: #ff8a80; text-align: center; font-size: 0.9rem; margin-top: 15px; font-weight: bold;"></p>
    </div>

    <!-- APP INTERIOR PRINCIPAL -->
    <div id="appSection" class="hidden">
      
      <div class="gg-header">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div class="logo-badge-gg" style="font-size: 1.5rem; padding: 2px 10px;">GG</div>
          <span id="userDisplay" style="font-size: 0.8rem; border: var(--border-white); padding: 4px 10px; border-radius: 15px; background: rgba(0,0,0,0.3);"></span>
          <button type="button" onclick="logout()" style="background: none; border: 1px solid var(--white); color: #fff; border-radius: 12px; padding: 5px 12px; cursor: pointer; font-size: 0.8rem;">Salir</button>
        </div>

        <div class="search-box" style="background: rgba(255, 255, 255, 0.12); border: var(--border-white); border-radius: 25px; padding: 8px 15px; display: flex; align-items: center; gap: 10px; margin-top: 15px;">
          <span>🔍</span>
          <input type="text" id="searchInput" onkeyup="buscarUsuario()" placeholder="Buscar por DNI, celular o nombre..." style="background: transparent; border: none; color: #fff; margin-bottom: 0;">
        </div>
        <div id="searchResults" class="search-results hidden"></div>
      </div>

      <div class="balance-card">
        <span style="color: var(--white-muted); font-size: 0.85rem;">FONDOS EN CUSTODIA (GUS & NOR #2)</span>
        <div class="balance-amount">S/ 0.00</div>
        <div style="display: flex; gap: 10px; margin-top: 12px;">
          <button type="button" class="btn-gg" onclick="scrollToSection('tratoSection')">Crear Trato</button>
          <button type="button" class="btn-gg btn-outline-white" onclick="scrollToSection('chatSection')">Chat Directo</button>
        </div>
      </div>

      <div class="card-section" id="tratoSection">
        <h3>🛡️ Registrar Trato en Custodia</h3>
        <select id="dealPaymentMethod">
          <option value="YAPE">Yape</option>
          <option value="CULQI">
