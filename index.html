
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#450817">
<title>Gus Gus</title>

<style>
:root{
--vino:#650b22;
--vino2:#450817;
--vino3:#8e183e;
--fondo:#fff8f5;
--crema:#fffdfb;
--rosa:#ebcfcf;
--rosa2:#f7e8e8;
--tinta:#2a2023;
--gris:#807279;
--linea:#eadcda;
--ok:#21845b;
--alerta:#b34c36;
--blanco:#fff;
--sombra:0 12px 35px rgba(50,4,19,.12);
--brillo:0 0 25px rgba(142,24,62,.13);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,Roboto,sans-serif}
body{
background:
radial-gradient(circle at 15% 10%,#8e183e30,transparent 35%),
radial-gradient(circle at 90% 90%,#650b2225,transparent 35%),
#26040e;
display:flex;justify-content:center;
color:var(--tinta);min-height:100vh
}
#app{
width:100%;max-width:480px;min-height:100vh;
background:linear-gradient(160deg,#fffaf8,#f8eeee);
position:relative;padding-bottom:90px;overflow:hidden;
box-shadow:0 0 60px #0005
}
button{cursor:pointer}
.demo{
background:linear-gradient(100deg,#450817,#76102d,#450817);
color:#fff;font-size:.68rem;text-align:center;
padding:10px;font-weight:800;letter-spacing:1.4px;
position:sticky;top:0;z-index:30;
border-bottom:1px solid #ffffff25
}
.top{
display:flex;justify-content:space-between;align-items:center;
padding:18px 17px;
background:linear-gradient(120deg,#fffdfb,#fff5f3);
border-bottom:1px solid var(--linea);
}
.top b{font-size:1rem;color:var(--vino)}
.saldo{
background:linear-gradient(120deg,#650b22,#8e183e);
color:#fff;padding:10px 14px;border-radius:30px;
font-weight:800;font-size:.85rem;
box-shadow:0 5px 15px #650b2235;
border:1px solid #ffffff35
}
.cuerpo{padding:17px 15px}
.blk{
background:rgba(255,255,255,.86);
border:1px solid #eadcda;border-radius:23px;
padding:18px;margin-bottom:16px;
box-shadow:var(--sombra);
backdrop-filter:blur(12px);
}
.nota{
background:linear-gradient(135deg,#fff1f1,#fff9f6);
border-color:#e9c7cf;font-size:.85rem;line-height:1.5
}
h2{font-size:1.08rem;margin-bottom:14px;color:var(--vino)}
label{
display:block;font-size:.82rem;font-weight:750;
color:var(--gris);margin:12px 0 6px
}
input,select{
width:100%;padding:14px;border:1px solid var(--linea);
border-radius:16px;font-size:.92rem;
background:#fffdfc;color:var(--tinta);transition:.2s
}
input:focus,select:focus{
outline:none;border-color:var(--vino3);
box-shadow:0 0 0 4px #ebcfcf66
}
input[readonly]{background:#f4eeee;color:var(--gris)}
.btn{
width:100%;margin-top:14px;padding:15px;border:0;
border-radius:30px;
background:linear-gradient(110deg,var(--vino2),var(--vino3));
color:#fff;font-weight:800;font-size:.96rem;
box-shadow:0 7px 20px #650b2235;
transition:.2s;letter-spacing:.2px
}
.btn:active,.mini:active,.quick:active{transform:scale(.97)}
.btn.sec{
background:linear-gradient(120deg,#fff,#f8eeee);
color:var(--vino);border:1px solid #dcbac4;box-shadow:none
}
.mini{
padding:9px 12px;border:0;border-radius:22px;
background:linear-gradient(110deg,var(--vino),var(--vino3));
color:#fff;font-weight:750;font-size:.76rem
}
.mini.sec{background:var(--rosa2);color:var(--vino)}
.sub{font-size:.82rem;color:var(--gris);margin-top:6px;line-height:1.5}
.msg{font-size:.85rem;margin-top:9px;color:var(--alerta);font-weight:650;min-height:1.1em}
.fila{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card{
border:1px solid #eadcda;border-radius:19px;
padding:14px;margin-bottom:12px;
background:linear-gradient(145deg,#fff,#fff9f7);
box-shadow:0 5px 18px #650b2210
}
.acc{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}
.tag{font-size:.7rem;font-weight:800;padding:6px 10px;border-radius:20px;background:#eee;color:#444}
.e-EN_CUSTODIA,.e-ENVIADO,.e-LIBERADO{background:#e3f3e9;color:var(--ok)}
.e-DISPUTA{background:#fbe5dc;color:var(--alerta)}
.e-PENDIENTE{background:#fff0d9;color:#956018}
.e-CANCELADO,.e-DEVUELTO{background:#eee;color:#666}
.hero{
background:
radial-gradient(circle at 90% 10%,#ffffff30,transparent 35%),
linear-gradient(135deg,#350510,#650b22 55%,#941b46);
color:#fff;border-radius:25px;padding:23px;
margin-bottom:17px;display:flex;flex-direction:column;gap:8px;
font-size:.88rem;box-shadow:0 12px 30px #45081740;
position:relative;overflow:hidden;
border:1px solid #ffffff30
}
.hero:after{
content:"";position:absolute;width:170px;height:170px;
border:1px solid #ffffff35;border-radius:50%;
right:-55px;top:-65px;
box-shadow:0 0 0 20px #ffffff08,0 0 0 40px #ffffff08,
0 0 35px #ffffff20
}
.hero b{font-size:2.25rem;letter-spacing:-1px;position:relative;z-index:1}
.hero span{position:relative;z-index:1}
.grid-quick{
display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px
}
.quick{
border:1px solid #ead4d9;border-radius:18px;
padding:17px 10px;background:linear-gradient(145deg,#fff,#fff3f3);
color:var(--vino);font-size:.82rem;font-weight:800;
display:flex;flex-direction:column;align-items:center;gap:8px;
box-shadow:0 5px 15px #650b2210;transition:.2s
}
.quick span{font-size:1.7rem;filter:drop-shadow(0 3px 5px #650b2220)}
.chat{
background:linear-gradient(145deg,#f9eeee,#fff8f5);
border:1px solid var(--linea);border-radius:20px;
height:340px;overflow-y:auto;padding:13px;margin:13px 0;
display:flex;flex-direction:column;gap:10px
}
.bur{
max-width:82%;padding:11px 14px;border-radius:18px;
font-size:.86rem;line-height:1.45;word-break:break-word;
box-shadow:0 3px 10px #650b2209
}
.bur small{
display:block;font-size:.65rem;color:var(--gris);
text-align:right;margin-top:4px
}
.yo{
align-self:flex-end;
background:linear-gradient(130deg,var(--vino),var(--vino3));
color:#fff;border-bottom-right-radius:5px
}
.yo small{color:#f5dfe6}
.otro{
align-self:flex-start;background:#fff;
border:1px solid var(--linea);border-bottom-left-radius:5px
}
.sis{
align-self:center;background:var(--rosa2);color:var(--vino);
font-size:.74rem;padding:7px 12px;border-radius:15px;text-align:center
}
nav{
position:fixed;bottom:0;width:100%;max-width:480px;
background:rgba(255,253,251,.96);backdrop-filter:blur(18px);
display:flex;border-top:1px solid var(--linea);
z-index:20;padding-bottom:env(safe-area-inset-bottom);
box-shadow:0 -7px 25px #45081712
}
nav button{
flex:1;padding:12px 0;border:0;background:none;
font-size:.73rem;font-weight:750;color:var(--gris)
}
nav button span{display:block;font-size:1.35rem;margin-bottom:3px}
nav button.on{color:var(--vino)}
nav button.on span{transform:translateY(-2px);filter:drop-shadow(0 3px 5px #650b2230)}
.logo{
width:110px;height:95px;margin:0 auto 12px;
display:flex;align-items:center;justify-content:center;color:var(--vino);
filter:drop-shadow(0 7px 10px #650b2220)
}
.logo svg{width:100%;height:100%;overflow:visible}
.marca{
font-size:2.6rem;font-weight:900;letter-spacing:-1.7px;
text-align:center;margin-bottom:7px;color:var(--vino)
}
.lema{
color:var(--gris);margin:5px 0 24px;
font-size:.94rem;text-align:center;line-height:1.5
}
.auth{
background:
radial-gradient(ellipse at 50% 35%,#fffdfb 0%,#fff8f5 65%,#f8e9e8 100%);
color:var(--tinta);min-height:100vh;padding:35px 23px;
display:flex;flex-direction:column;justify-content:center;
position:relative;overflow:hidden
}
.auth:before,.auth:after{
content:"";position:absolute;border-radius:50%;pointer-events:none
}
.auth:before{
width:230px;height:230px;background:#ebcfcf55;
top:-155px;left:-110px
}
.auth:after{
width:220px;height:220px;background:#650b2210;
bottom:-160px;right:-110px
}
.auth>*{position:relative;z-index:1}
.auth label{color:var(--tinta)}
.auth input{
background:#fff;border-color:var(--linea);
color:var(--tinta);border-radius:16px
}
.auth input::placeholder{color:#aa9da1}
.auth .btn{margin-top:17px}
.auth .msg{color:var(--alerta)}
.link{
background:none;border:0;color:var(--vino);
margin-top:13px;font-size:.86rem;padding:7px;font-weight:650
}
.bienvenida{text-align:center}
.bienvenida .logo{width:135px;height:115px;margin-bottom:8px}
.bienvenida .marca{font-size:3rem}
.bienvenida .lema{margin:8px auto 23px}
.decoracion{
width:110px;height:4px;background:var(--rosa);
border-radius:10px;margin:15px auto 22px
}
.pie-auth{
text-align:center;font-size:.78rem;color:var(--gris);
margin-top:27px;font-style:italic
}
.auth .btn.sec{
background:transparent;color:var(--vino);
border:1px solid var(--vino);box-shadow:none
}
.perfil-cabeza{text-align:center;padding:10px 0 18px}
.avatar{
width:86px;height:86px;border-radius:50%;margin:0 auto 10px;
background:linear-gradient(135deg,#f4cbd5,#e9aebe);
display:flex;align-items:center;justify-content:center;
color:var(--vino);font-size:2.4rem;border:4px solid #fff;
box-shadow:var(--sombra);overflow:hidden
}
.avatar img{width:100%;height:100%;object-fit:cover}
.foto-ayuda{text-align:center;font-size:.75rem;color:var(--gris);margin-top:8px}
.foto-input{font-size:.78rem;padding:11px}
@media(min-width:481px){
body{padding:15px 0}
#app{border-radius:25px;min-height:95vh}
nav{bottom:15px;border-radius:0 0 25px 25px}
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>
<div id="app"></div>

<script>
const SB_URL='https://zbeidmuunsmgzeuovcko.supabase.co';
const SB_KEY='sb_publishable_T54DQZRoqNG44DhoEjpDCw_ox7m7LgG';
const db=supabase.createClient(SB_URL,SB_KEY);

let me=null,deals=[],msgs=[],tab='inicio',chatDeal=null,modo='welcome',timer=null;
let avatarFile=null,avatarPreviewUrl=null;

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round(Number(n)*100)/100;
const money=n=>'S/ '+r2(n).toFixed(2);
const hora=t=>new Date(t).toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'});
const code=d=>'GG-'+(1000+d.id);

const ETQ={
PENDIENTE:'Esperando pago',
EN_CUSTODIA:'Dinero en custodia',
ENVIADO:'Enviado',
LIBERADO:'Pago liberado',
DISPUTA:'En disputa',
DEVUELTO:'Devuelto',
CANCELADO:'Cancelado'
};

/* Comisión provisional de demostración.
   Debe configurarse y validarse en el servidor antes de cobrar dinero real. */
const fees=m=>{
const h=r2(Math.max(m*0.07,3)/2);
return{c:h,v:h}
};

function logo(){
return `<div class="logo" aria-label="Logo Gus Gus">
<svg viewBox="0 0 160 125" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M15 48 L38 20 L62 33 L80 27 L98 33 L122 20 L145 48 L124 67 L111 57" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M37 35 L57 46 Q67 51 77 43 L87 36 Q96 30 105 38 L126 55 Q134 63 127 71 Q120 78 112 71 L91 55" fill="#EBCFCF" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M54 46 L39 65 Q32 74 40 81 Q47 87 55 79 L67 66" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
<path d="M68 64 L57 79 Q51 88 60 94 Q68 99 75 90 L86 76" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
<path d="M84 73 L75 87 Q69 98 79 103 Q88 108 95 97 L103 84" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
<path d="M100 84 L94 96 Q90 106 100 110 Q109 114 115 103 L122 89" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
<path d="M15 48 L37 35 L53 49 L39 76 Z" fill="#650B22" stroke="currentColor" stroke-width="4"/>
<path d="M145 48 L123 35 L107 49 L121 76 Z" fill="#650B22" stroke="currentColor" stroke-width="4"/>
<path d="M80 9 V1 M58 15 L52 7 M102 15 L108 7" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
</svg></div>`;
}

async function rpc(fn,args){
const r=await db.rpc(fn,args);
if(r.error){alert(r.error.message);return null}
return r.data==null?true:r.data
}

async function entrar(){
const u=(await db.auth.getUser()).data.user;
if(!u){me=null;return render()}
const p=await db.from('profiles').select('*').eq('id',u.id).single();
if(p.error){
alert('No se encontró tu perfil.');
await db.auth.signOut();
me=null;
return render()
}
me=p.data;me.email=u.email;
await refrescar();
tab='inicio';render();
clearInterval(timer);timer=setInterval(poll,5000);
}

async function refrescar(){
const [p,d]=await Promise.all([
db.from('profiles').select('*').eq('id',me.id).single(),
db.from('deals').select('*').order('id',{ascending:false})
]);
if(p.data){const e=me.email;me=p.data;me.email=e}
deals=d.data||[];
}

async function cargarMsgs(){
if(!chatDeal)return;
const r=await db.from('messages').select('*').eq('deal_id',chatDeal).order('id');
msgs=r.data||[];
}

async function poll(){
if(!me)return;
await refrescar();
if(tab==='chat'){await cargarMsgs();pintarChat()}
else if(!['INPUT','SELECT','TEXTAREA'].includes((document.activeElement||{}).tagName))render();
}

function setModo(m){modo=m;render()}
function msg(t){$('a_msg').textContent=t}

async function doLogin(){
const r=await db.auth.signInWithPassword({
email:$('a_mail').value.trim(),
password:$('a_pass').value
});
if(r.error)return msg('Correo o contraseña incorrectos.');
await entrar();
}

async function doReg(){
const n=$('a_name').value.trim();
const d=$('a_dni').value.trim();
const t=$('a_tel').value.trim();
const e=$('a_mail').value.trim();
const p=$('a_pass').value;
if(n.length<3)return msg('Escribe tu nombre completo.');
if(!/^\d{8}$/.test(d))return msg('El DNI debe tener 8 números.');
if(!/^9\d{8}$/.test(t))return msg('El celular debe tener 9 números y empezar con 9.');
if(!/^\S+@\S+\.\S+$/.test(e))return msg('Escribe un correo válido.');
if(p.length<6)return msg('La contraseña debe tener al menos 6 caracteres.');

const r=await db.auth.signUp({
email:e,password:p,
options:{data:{name:n,dni:d,tel:t}}
});
if(r.error)return msg('No se pudo crear la cuenta. El correo o el DNI podrían estar en uso.');
if(!r.data.session)return msg('Cuenta creada. Confirma tu correo y luego inicia sesión.');
await entrar();
}

async function salir(){
clearInterval(timer);
await db.auth.signOut();
me=null;deals=[];avatarFile=null;avatarPreviewUrl=null;
modo='welcome';render();
}

function authView(){
if(modo==='welcome'){
return `<div class="auth bienvenida">
${logo()}
<div class="marca">Gus Gus</div>
<p class="lema">Compra y vende con confianza</p>
<div class="decoracion"></div>
<button class="btn" onclick="setModo('reg')">Crear cuenta　→</button>
<button class="btn sec" onclick="setModo('login')">Iniciar sesión</button>
<p class="pie-auth">Tratos más seguros, personas más tranquilas.</p>
</div>`;
}
const r=modo==='reg';
return `<div class="auth">
${logo()}
<div class="marca">Gus Gus</div>
<p class="lema">${r?'Únete a nuestra comunidad':'Bienvenido de nuevo. Ingresa a tu cuenta.'}</p>
${r?`
<label>Nombre completo</label>
<input id="a_name" autocomplete="name" placeholder="Tu nombre completo">
<label>DNI</label>
<input id="a_dni" inputmode="numeric" maxlength="8" placeholder="DNI (8 números)">
<label>Celular</label>
<input id="a_tel" inputmode="tel" maxlength="9" placeholder="Celular (9 números)">
`:''}
<label>Correo electrónico</label>
<input id="a_mail" type="email" autocomplete="email" placeholder="correo@ejemplo.com">
<label>Contraseña</label>
<input id="a_pass" type="password" autocomplete="${r?'new-password':'current-password'}" placeholder="Tu contraseña">
<button class="btn" onclick="${r?'doReg()':'doLogin()'}">${r?'Crear mi cuenta　→':'Ingresar　→'}</button>
<p id="a_msg" class="msg"></p>
<button class="link" onclick="setModo('${r?'login':'reg'}')">${r?'¿Ya tienes cuenta? Inicia sesión':'¿No tienes cuenta? Crear cuenta'}</button>
<button class="link" onclick="setModo('welcome')">Volver al inicio</button>
</div>`;
}

/* TRATOS */
async function act(id,a){
if(await rpc('deal_action',{p_deal:id,p_action:a})){
await refrescar();render()
}
}

function botones(d){
const c=d.buyer===me.id,v=d.seller===me.id,b=[],s=d.status;
const B=(a,t,k)=>b.push(`<button class="mini ${k||''}" onclick="act(${d.id},'${a}')">${t}</button>`);
if(s==='PENDIENTE'){
if(c)B('pagar','Pagar (demo)');
B('cancelar','Cancelar','sec')
}
if(s==='EN_CUSTODIA'){
if(v)B('enviar','Marcar como enviado');
if(c)B('disputa','Reportar problema','sec');
if(v)B('devolver','Devolver el dinero','sec')
}
if(s==='ENVIADO'){
if(c){B('liberar','Confirmar recepción');B('disputa','Reportar problema','sec')}
if(v)B('devolver','Devolver el dinero','sec')
}
if(s==='DISPUTA'){
if(c)B('liberar','Liberar al vendedor','sec');
if(v)B('devolver','Devolver el dinero','sec')
}
b.push(`<button class="mini sec" onclick="abrirChat(${d.id})">Abrir chat</button>`);
return b.join('');
}

function card(d){
const rol=d.buyer===me.id?'Compras a '+d.seller_name:'Vendes a '+d.buyer_name;
return `<div class="card">
<div class="fila"><b>${code(d)}</b><span class="tag e-${d.status}">${ETQ[d.status]}</span></div>
<div style="margin-top:9px;font-weight:650">${esc(d.description)}</div>
<div class="sub">${esc(rol)} · ${money(d.amount)}</div>
${d.status==='DISPUTA'?'<div class="sub">Este trato está en disputa.</div>':''}
<div class="acc">${botones(d)}</div>
</div>`;
}

function prev(){
const m=parseFloat($('t_m').value),p=$('t_prev');
if(!(m>0)){p.textContent='Escribe el monto para ver el desglose.';return}
const f=fees(m);
p.textContent=`Comisión total ${money(f.c+f.v)}, mitad cada uno. El comprador paga ${money(m+f.c)} y el vendedor recibe ${money(m-f.v)}.`;
}

async function crear(){
const v=$('t_v').value.trim(),m=parseFloat($('t_m').value),d=$('t_d').value.trim();
if(!/^\d{8}$/.test(v)||!(m>=1)||d.length<3){
$('t_msg').textContent='Revisa el DNI del vendedor, el monto y la descripción.';return
}
if(await rpc('create_deal',{p_seller_dni:v,p_amount:m,p_desc:d})){
await refrescar();render()
}
}

/* CHAT */
async function abrirChat(id){
chatDeal=id;await cargarMsgs();go('chat');
}
async function selChat(v){
chatDeal=Number(v);await cargarMsgs();render();
}
function pintarChat(){
const cb=$('chatbox');if(!cb)return;
cb.innerHTML=msgs.map(m=>m.is_system
?`<div class="sis">${esc(m.body)}</div>`
:`<div class="bur ${m.sender===me.id?'yo':'otro'}">${esc(m.body)}<small>${hora(m.created_at)}</small></div>`
).join('');
cb.scrollTop=cb.scrollHeight;
}
async function enviar(){
const i=$('c_in'),t=i.value.trim();if(!t)return;
i.value='';
if(await rpc('send_message',{p_deal:chatDeal,p_body:t})){
await cargarMsgs();pintarChat()
}
}

/* PERFIL Y FOTO PRIVADA */
function previsualizarAvatar(input){
const f=input.files&&input.files[0];
if(!f)return;
if(!['image/jpeg','image/png','image/webp'].includes(f.type)){
alert('Usa una imagen JPG, PNG o WEBP.');
input.value='';return
}
if(f.size>2*1024*1024){
alert('La imagen no debe superar los 2 MB.');
input.value='';return
}
avatarFile=f;
if(avatarPreviewUrl)URL.revokeObjectURL(avatarPreviewUrl);
avatarPreviewUrl=URL.createObjectURL(f);
const img=$('avatar_img');
if(img)img.src=avatarPreviewUrl;
}

async function mostrarAvatar(){
const img=$('avatar_img');
if(!img||!me||!me.avatar_url)return;
const {data,error}=await db.storage.from('avatars').createSignedUrl(me.avatar_url,3600);
if(!error&&data&&$('avatar_img'))$('avatar_img').src=data.signedUrl;
}

async function guardarPerfil(){
const n=$('p_name').value.trim(),t=$('p_tel').value.trim();
const e=$('p_msg');
if(n.length<3){e.textContent='Escribe tu nombre completo.';return}
if(t&&!/^9\d{8}$/.test(t)){e.textContent='El celular debe tener 9 números y empezar con 9.';return}

let avatarPath=me.avatar_url||null;

if(avatarFile){
const ext=avatarFile.type==='image/jpeg'?'jpg':
avatarFile.type==='image/png'?'png':'webp';
avatarPath=`${me.id}/foto.${ext}`;
const up=await db.storage.from('avatars').upload(
avatarPath,avatarFile,
{upsert:true,contentType:avatarFile.type}
);
if(up.error){
e.style.color='var(--alerta)';
e.textContent='No se pudo subir la foto. Inténtalo otra vez.';
return
}
}

const r=await db.from('profiles')
.update({name:n,tel:t,avatar_url:avatarPath})
.eq('id',me.id);

if(r.error){
e.style.color='var(--alerta)';
e.textContent='No se pudo guardar el perfil.';
return
}

avatarFile=null;
if(avatarPreviewUrl){URL.revokeObjectURL(avatarPreviewUrl);avatarPreviewUrl=null}
e.style.color='var(--ok)';
e.textContent='Perfil guardado correctamente.';
await refrescar();
render();
}

async function recargar(){
if(await rpc('demo_topup')){await refrescar();render()}
}

function vChat(){
if(!deals.length)return '<div class="blk"><h2>Mis chats</h2><p class="sub">El chat se abre desde un trato. Crea uno primero.</p></div>';
if(!deals.find(x=>x.id===chatDeal))chatDeal=deals[0].id;
return `<div class="blk">
<h2>Mis conversaciones</h2>
<select onchange="selChat(this.value)">
${deals.map(x=>`<option value="${x.id}"${x.id===chatDeal?' selected':''}>${code(x)} · ${esc(x.description)}</option>`).join('')}
</select>
<div class="chat" id="chatbox"></div>
<div class="fila">
<input id="c_in" placeholder="Escribe un mensaje..." maxlength="300">
<button class="mini" onclick="enviar()">➤</button>
</div>
</div>`;
}

<div class="perfil-cabeza">
<div class="avatar" id="avatar_wrap">

`<img id="avatar_img" src="" alt="Foto de perfil" style="display:none">👤`}
</div>
<h2>${esc(me.name)}</h2>
<p class="sub">${esc(me.email)}</p>
</div>
<label>Foto de perfil</label>
<input class="foto-input" type="file" accept="image/jpeg,image/png,image/webp" onchange="previsualizarAvatar(this)">
<p class="foto-ayuda">JPG, PNG o WEBP · Máximo 2 MB</p>
<label>Nombre completo</label>
<input id="p_name" value="${esc(me.name)}">
<label>DNI</label>
<input value="${esc(me.dni)}" readonly>
<label>Correo electrónico</label>
<input value="${esc(me.email)}" readonly>

<input id="p_tel" inputmode="tel" maxlength="9" value="${esc(me.tel)}">
<button class="btn" onclick="guardarPerfil()">Guardar cambios</button>

</div>
<div class="blk">
<h2>Herramientas de prueba</h2>
<p class="sub">Saldo de prueba: ${money(me.balance)}</p>
<button class="btn sec" onclick="recargar()">Recargar S/ 100 de prueba</button>
<button class="btn sec" onclick="salir()">Cerrar sesión</button>

}

function go(t){
tab=t;
avatarFile=null;
if(avatarPreviewUrl){URL.revokeObjectURL(avatarPreviewUrl);avatarPreviewUrl=null}
render()
}

function render(){
if(!me){$('app').innerHTML=authView();return}
const body={inicio:vInicio,tratos:vTratos,chat:vChat,perfil:vPerfil}[tab]();
$('app').innerHTML=`
<div class="demo">GUS GUS · MODO DEMOSTRACIÓN · SIN DINERO REAL</div>
<div class="top">
<b>Hola, ${esc((me.name||'').split(' ')[0])} 👋</b>
<span class="saldo">${money(me.balance)}</span>
</div>
<div class="cuerpo">${body}</div>
<nav>
${[['inicio','⌂','Inicio'],['tratos','＋','Tratos'],['chat','▤','Chats'],['perfil','♙','Perfil']].map(([k,i,l])=>
`<button class="${tab===k?'on':''}" onclick="go('${k}')"><span>${i}</span>${l}</button>`
).join('')}
</nav>`;
if(tab==='chat')pintarChat();
if(tab==='perfil')mostrarAvatar();
window.scrollTo(0,0);
}

db.auth.getSession().then(r=>{
if(r.data.session)entrar();
else render();
});
</script>
