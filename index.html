<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
:root{--wine:#650b22;--wine2:#3d0716;--wine3:#941d46;--cream:#fbf7f5;--paper:#fff;--ink:#24141a;--muted:#8b777e;--line:#eadde1;--pink:#f8edf0;--green:#16834a;--shadow:0 12px 34px #4b0a1a12}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:wait}#app{min-height:100vh;padding-bottom:90px}.top{position:sticky;top:0;z-index:10;background:#fffdfbf0;backdrop-filter:blur(15px);border-bottom:1px solid var(--line);padding:11px 15px}.topin{max-width:900px;margin:auto;display:flex;align-items:center;gap:11px}.brandmark{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,var(--wine3),var(--wine2));display:grid;place-items:center;color:white;font-size:23px;font-weight:900}.brand{font-size:21px;font-weight:950;letter-spacing:-.8px;color:var(--wine)}.tagline{font-size:10px;color:var(--muted)}.topspacer{flex:1}.iconbtn{border:1px solid var(--line);background:white;color:var(--wine);border-radius:12px;padding:10px 12px;font-weight:800}.wrap{max-width:900px;margin:auto;padding:17px 14px 28px}.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:17px;margin:12px 0;box-shadow:var(--shadow)}h1,h2,h3,p{margin-top:0}h1{font-size:25px;line-height:1.15}h2{font-size:18px;margin-bottom:10px}h3{font-size:14px;margin-bottom:8px}.muted{color:var(--muted);font-size:12px;line-height:1.5}.small{font-size:11px;color:var(--muted)}.hero{background:radial-gradient(circle at 90% 5%,#a62a51 0,transparent 30%),linear-gradient(135deg,#811638,#390714);border-radius:25px;color:white;padding:23px;position:relative;overflow:hidden;box-shadow:0 15px 32px #4b0a1a2a}.hero p{color:#f3dce3;font-size:12px;margin-bottom:0}.hero h1{max-width:330px;margin:8px 0}.hero .mascot{position:absolute;right:10px;bottom:-3px;width:132px;height:150px;opacity:.9;pointer-events:none}.btn{border:0;border-radius:13px;padding:12px 15px;font-weight:850;margin-top:9px}.primary{background:linear-gradient(135deg,var(--wine3),var(--wine2));color:#fff;box-shadow:0 7px 17px #650b2220}.secondary{background:var(--pink);color:var(--wine)}.outline{background:white;color:var(--wine);border:1px solid var(--wine)}.danger{background:#fff0f0;color:#a12535}.full{width:100%}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.tile{background:white;border:1px solid var(--line);border-radius:17px;padding:15px;text-align:left;min-height:91px;color:var(--ink);box-shadow:var(--shadow)}.tile strong{display:block;color:var(--wine);font-size:14px;margin:8px 0 3px}.tile small{font-size:10px;color:var(--muted)}.tile .tileicon{width:34px;height:34px;border-radius:11px;background:var(--pink);display:grid;place-items:center;color:var(--wine);font-size:17px;font-weight:900}.money{font-size:28px;font-weight:950;color:var(--wine);letter-spacing:-1px}.pill{display:inline-block;padding:5px 9px;border-radius:30px;background:var(--pink);color:var(--wine);font-size:10px;font-weight:850}.pill.green{background:#e7f7ee;color:var(--green)}.field{margin:12px 0}.field label{display:block;font-size:11px;font-weight:850;color:#60424c;margin-bottom:6px}.field input,.field textarea,.field select,.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fffdfc;color:var(--ink);outline:none}.field textarea{min-height:88px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--wine3);box-shadow:0 0 0 3px #941d4612}.tabs{display:flex;gap:7px;overflow:auto;margin:12px 0}.tab{white-space:nowrap;border:1px solid var(--line);background:white;color:var(--muted);padding:9px 12px;border-radius:30px;font-size:11px;font-weight:850}.tab.active{background:var(--wine);color:white;border-color:var(--wine)}.nav{position:fixed;z-index:12;bottom:0;left:0;right:0;background:#fffdfbf2;backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:7px 4px calc(7px + env(safe-area-inset-bottom))}.nav button{flex:1;max-width:180px;border:0;background:none;color:#8b777e;font-size:10px;font-weight:800;padding:5px 2px}.nav button b{display:block;font-size:17px;margin-bottom:3px;color:inherit}.nav button.active{color:var(--wine)}.auth{max-width:430px;margin:0 auto;padding:28px 16px}.authbrand{text-align:center;padding:12px 0 20px}.authbrand .brandmark{width:66px;height:66px;border-radius:22px;margin:0 auto 12px;font-size:32px}.authbrand .brand{font-size:31px}.authcard{background:white;border:1px solid var(--line);border-radius:23px;padding:20px;box-shadow:var(--shadow)}.authcard h2{font-size:21px}.link{border:0;background:none;color:var(--wine);font-weight:900;padding:8px}.product{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:10px;margin:9px 0;background:white}.productimg{height:86px;border-radius:12px;background:linear-gradient(135deg,#f6e9ed,#fff);display:grid;place-items:center;color:var(--wine);font-weight:900}.product h3{margin:0 0 4px}.product .price{font-size:19px;color:var(--wine);font-weight:950}.chatbox{height:48vh;min-height:260px;max-height:510px;overflow:auto;display:flex;flex-direction:column;gap:9px;padding:8px 2px}.bubble{max-width:86%;padding:11px 13px;border-radius:15px;background:#f5eaed;font-size:13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.mine{align-self:flex-end;background:var(--wine);color:white}.chatwrite{display:flex;gap:7px}.chatwrite input{min-width:0;flex:1;border:1px solid var(--line);border-radius:12px;padding:12px}.avatar{width:82px;height:82px;border-radius:50%;background:var(--pink);display:grid;place-items:center;overflow:hidden;border:3px solid white;box-shadow:var(--shadow);font-size:25px;color:var(--wine);font-weight:900}.avatar img{width:100%;height:100%;object-fit:cover}.listrow{padding:12px 0;border-bottom:1px solid var(--line)}.listrow:last-child{border-bottom:0}.hide{display:none!important}.legalcheck{display:flex;gap:9px;align-items:flex-start;background:#fff8fa;border:1px solid var(--line);border-radius:13px;padding:12px;font-size:11px;line-height:1.5;color:#60424c}.legalcheck input{width:18px;height:18px;flex:0 0 18px;margin:1px 0 0;accent-color:var(--wine)}.legal-links{display:flex;flex-wrap:wrap;gap:4px 10px;margin:8px 0 12px}.legal-links button{border:0;background:none;color:var(--wine);text-decoration:underline;font-size:11px;font-weight:850;padding:3px 0}.legal-overlay{position:fixed;inset:0;z-index:50;background:#19070dcc;display:flex;align-items:flex-end;justify-content:center;padding:12px}.legal-modal{width:min(100%,620px);max-height:88vh;overflow:auto;background:white;border-radius:20px;padding:20px;box-shadow:0 20px 60px #0005}.legal-modal h2{color:var(--wine)}.legal-modal p,.legal-modal li{font-size:12px;line-height:1.6}.legal-modal .legalclose{position:sticky;bottom:0;background:white;padding-top:8px}.notice{background:#fff7e7;border:1px solid #f1dfb8;color:#72551a;padding:12px;border-radius:13px;font-size:11px;line-height:1.5}.stats{font-size:24px;font-weight:950;color:var(--wine)}.empty{text-align:center;padding:28px 12px;color:var(--muted);font-size:12px}
@media(min-width:650px){.wrap{padding:24px 20px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.hero{padding:30px}.product{grid-template-columns:110px 1fr}}
</style>
</head>
<body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script>
<script>
'use strict';
const cfg=window.GUSGUS_CONFIG||{};
const db=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=(n,c='PEN')=>(c==='USD'?'US$ ':'S/ ')+Number(n||0).toFixed(2);const date=v=>v?new Date(v).toLocaleString('es-PE',{dateStyle:'short',timeStyle:'short'}):'';
let user=null,profile=null,roles=[],page='home',listings=[],deals=[],proposals=[],messages=[],selectedDeal=null,commission=0,aiBusy=false,avatarFile=null;
const isStaff=()=>roles.some(r=>['owner','admin'].includes(r.role));const isCreator=()=>isStaff()||roles.some(r=>r.role==='creator');
function historyKey(){return 'gusgus_guss_history_'+user.id}
function aiHistory(){try{return JSON.parse(localStorage.getItem(historyKey())||'[]')}catch{return []}}
function saveAiHistory(a){localStorage.setItem(historyKey(),JSON.stringify(a.slice(-60)))}
function setPage(p){page=p;render()}
function logo(){return '<div class="brandmark">G</div>'}
function shell(content){return `<header class="top"><div class="topin">${logo()}<div><div class="brand">GusGus</div><div class="tagline">Compra · Vende · Conecta</div></div><div class="topspacer"></div><button class="iconbtn" onclick="setPage('notifications')">Avisos</button></div></header><main class="wrap">${content}</main><nav class="nav"><button class="${page==='home'?'active':''}" onclick="setPage('home')"><b>⌂</b>Inicio</button><button class="${page==='market'?'active':''}" onclick="setPage('market')"><b>⌕</b>Comprar</button><button class="${page==='guss'?'active':''}" onclick="setPage('guss')"><b>G</b>GUSS</button><button class="${page==='deals'?'active':''}" onclick="setPage('deals')"><b>▤</b>Tratos</button><button class="${page==='profile'?'active':''}" onclick="setPage('profile')"><b>○</b>Perfil</button></nav>`}
async function loadProfile(){const {data,error}=await db.from('profiles').select('*').eq('id',user.id).single();if(error)throw error;profile=data;}
async function loadRoles(){const {data,error}=await db.from('user_roles').select('role').eq('user_id',user.id);if(error)throw error;roles=data||[];}
async function loadListings(){const {data,error}=await db.from('listings').select('*').eq('status','active').order('created_at',{ascending:false}).limit(50);if(error&&error.code!=='42P01')console.warn(error);listings=data||[];}
async function loadDeals(){const {data,error}=await db.from('deals').select('*').or(`buyer.eq.${user.id},seller.eq.${user.id}`).order('created_at',{ascending:false}).limit(50);if(error){console.warn(error);deals=[]}else deals=data||[];}
async function loadProposals(){const {data,error}=await db.from('deal_proposals').select('*').or(`buyer_id.eq.${user.id},seller_id.eq.${user.id}`).order('created_at',{ascending:false}).limit(50);if(error){console.warn('Propuestas:',error.message);proposals=[]}else proposals=data||[];}
async function loadSettings(){if(!isStaff())return;const {data}=await db.from('app_settings').select('setting_value').eq('setting_key','commission_percent').maybeSingle();if(data){const saved=Number(data.setting_value);commission=Number.isFinite(saved)?saved:0;}}
async function refresh(){await Promise.all([loadProfile(),loadRoles(),loadListings(),loadDeals(),loadProposals()]);await loadSettings();render()}
async function login(){const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return alert('Completa correo y contraseña.');const b=$('authBtn');b.disabled=true;const {data,error}=await db.auth.signInWithPassword({email,password});b.disabled=false;if(error)return alert(error.message);user=data.user;await afterLogin()}
async function register(){const name=$('name').value.trim(),dni=$('dni').value.trim(),tel=$('tel').value.trim(),email=$('email').value.trim(),password=$('password').value,accepted=$('acceptTerms')?.checked;if(!name||!dni||!tel||!email||!password)return alert('Completa todos los campos.');if(!/^\d{8}$/.test(dni))return alert('El DNI debe tener 8 dígitos.');if(password.length<8)return alert('La contraseña debe tener al menos 8 caracteres.');if(!accepted)return alert('Debes leer y aceptar los Términos, la Política de Protección y la Política de Pagos para crear tu cuenta.');const b=$('authBtn');b.disabled=true;const {data,error}=await db.auth.signUp({email,password,options:{data:{name,dni,tel,gusgus_terms_accepted:true,gusgus_terms_version:'1.0.0',gusgus_terms_accepted_at:new Date().toISOString()}}});b.disabled=false;if(error)return alert(error.message);if(data.session&&data.user){const {error:pe}=await db.from('profiles').upsert({id:data.user.id,name,dni,tel},{onConflict:'id'});if(pe)console.error(pe)}if(data.session){user=data.user;await afterLogin()}else{alert('Cuenta creada. Revisa tu correo para confirmar el registro. La aceptación de condiciones quedó asociada al registro.');renderAuth('login')}}
async function resetPassword(){const email=$('email').value.trim();if(!email)return alert('Escribe tu correo primero.');const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin});alert(error?error.message:'Te enviamos un enlace para restablecer tu contraseña.')}
async function afterLogin(){try{await refresh();page='home';render()}catch(e){console.error(e);alert('No se pudo cargar tu cuenta: '+e.message)}}
async function logout(){await db.auth.signOut();user=null;profile=null;roles=[];renderAuth('login')}
function renderAuth(mode='login'){page='auth';$('app').innerHTML=`<div class="auth"><div class="authbrand">${logo()}<div class="brand">GusGus</div><p class="muted">Compra · Vende · Conecta</p></div><div class="authcard"><h2>${mode==='login'?'Bienvenido de nuevo':'Crea tu cuenta'}</h2><p class="muted">${mode==='login'?'Ingresa a tu cuenta GusGus.':'Regístrate para comprar y vender con confianza.'}</p>${mode==='register'?`<div class="field"><label>Nombre completo</label><input id="name" autocomplete="name" placeholder="Tu nombre"></div><div class="field"><label>DNI</label><input id="dni" inputmode="numeric" maxlength="8" placeholder="Tu DNI"></div><div class="field"><label>Teléfono</label><input id="tel" inputmode="tel" placeholder="Tu teléfono"></div>`:''}<div class="field"><label>Correo electrónico</label><input id="email" type="email" autocomplete="email" placeholder="correo@ejemplo.com"></div><div class="field"><label>Contraseña</label><input id="password" type="password" autocomplete="${mode==='login'?'current-password':'new-password'}" placeholder="Mínimo 8 caracteres"></div>${mode==='register'?`<div class="legal-links"><button type="button" onclick="openLegalDoc('terms')">Leer Términos y Condiciones</button><button type="button" onclick="openLegalDoc('protection')">Leer Política de Protección</button><button type="button" onclick="openLegalDoc('payments')">Leer Política de Pagos</button></div><label class="legalcheck"><input id="acceptTerms" type="checkbox"><span>He leído y acepto los Términos y Condiciones, la Política de Protección de Tratos y la Política de Pagos, Comisiones y Reembolsos de GusGus (versión 1.0.0).</span></label><p class="small" style="margin:8px 2px">La aceptación es obligatoria para crear una cuenta. Puedes consultar los documentos antes de marcar la casilla.</p>`:''}<button id="authBtn" class="btn primary full" onclick="${mode==='login'?'login()':'register()'}">${mode==='login'?'Iniciar sesión':'Crear cuenta'}</button>${mode==='login'?`<button class="link" onclick="resetPassword()">¿Olvidaste tu contraseña?</button>`:''}<p class="muted">${mode==='login'?'¿No tienes cuenta?':'¿Ya tienes cuenta?'} <button class="link" onclick="renderAuth('${mode==='login'?'register':'login'}')">${mode==='login'?'Regístrate':'Inicia sesión'}</button></p></div><p class="small" style="text-align:center;margin-top:18px">Tu correo y tus datos privados solo son visibles para ti y el personal autorizado.</p></div>`}
function openLegalDoc(type){const docs={terms:{title:'Términos y Condiciones',body:`<p><b>Versión 1.0.0 · Borrador de implementación</b></p><p>GusGus es una plataforma que facilita el contacto y la gestión de propuestas entre compradores y vendedores. Cada usuario debe proporcionar información veraz, mantener segura su cuenta y utilizar la plataforma de buena fe.</p><h3>1. Cuentas y conducta</h3><ul><li>La cuenta es personal y no debe compartirse.</li><li>No se permite suplantación, fraude, falsificación de pruebas, productos ilícitos ni uso abusivo.</li><li>El usuario debe revisar cuidadosamente el precio, moneda, descripción y condiciones antes de aceptar un trato.</li></ul><h3>2. Tratos</h3><p>Una propuesta no se convierte en trato hasta que el comprador la acepta. La aceptación de una propuesta, por sí sola, no confirma un pago ni demuestra que exista dinero recibido.</p><h3>3. Comisiones</h3><p>Las comisiones aplicables deben mostrarse antes de aceptar el trato. La configuración prevista divide la comisión total en partes iguales entre comprador y vendedor. Si la comisión está en 0%, no se cobra comisión.</p><h3>4. Limitaciones actuales</h3><p>Las funciones de pago, custodia, reembolso y transferencia solo podrán activarse cuando GusGus cuente con un proveedor, cuentas y autorizaciones adecuados. No se debe transferir dinero basándose únicamente en una pantalla o notificación de la aplicación.</p><h3>5. Suspensión y soporte</h3><p>GusGus podrá revisar operaciones sospechosas, restringir temporalmente funciones y solicitar información necesaria para resolver incidencias, respetando la normativa aplicable.</p>`},protection:{title:'Política de Protección de Tratos',body:`<p><b>Versión 1.0.0 · Borrador de implementación</b></p><h3>1. Evidencia del vendedor</h3><p>El vendedor debe subir una fotografía clara del producto preparado y/o de la entrega al transportista. Cuando corresponda, debe aportar guía, constancia o código de seguimiento. Una foto por sí sola no prueba que el paquete haya llegado.</p><h3>2. Confirmación del comprador</h3><p>Al recibir el producto, el comprador puede marcar «Ya recibí mi pedido» y adjuntar fotografías del paquete y del producto recibido. Debe revisar que corresponda con la propuesta aceptada.</p><h3>3. Reclamaciones</h3><p>El comprador puede abrir una reclamación si no recibió el producto, llegó dañado, está incompleto o no corresponde a lo ofrecido. Debe explicar el problema y adjuntar evidencia. La confirmación de recepción no debe eliminar el derecho a reportar un defecto oculto o un problema que no pudo detectarse razonablemente al recibirlo.</p><h3>4. Revisión y liberación</h3><p>Las evidencias se ponen a disposición de la revisión. La liberación al vendedor requiere verificar el depósito, revisar el estado del trato y registrar el comprobante de transferencia. Una disputa mantiene la liberación suspendida hasta su resolución.</p><h3>5. No automatización por fotografías</h3><p>Las fotografías son elementos de apoyo y no garantizan por sí solas la autenticidad, el envío o la recepción. GusGus puede solicitar información adicional.</p>`},payments:{title:'Política de Pagos, Comisiones y Reembolsos',body:`<p><b>Versión 1.0.0 · Borrador de implementación</b></p><h3>1. Verificación del pago</h3><p>El comprador debe verificar el nombre del beneficiario y los datos de pago que la plataforma muestre cuando exista un método autorizado y activo. Nunca debe enviar dinero a datos recibidos por chats externos o modificados por terceros.</p><p>El comprador puede avisar que realizó una transferencia, pero ese aviso no confirma el abono. El depósito solo cambia a confirmado después de comprobar el ingreso real en la cuenta o mediante la confirmación del proveedor de pagos.</p><h3>2. Liberación al vendedor</h3><p>La liberación es una operación separada de la confirmación del depósito. Requiere revisión del trato, recepción o resolución de incidencias y constancia de la transferencia al vendedor.</p><h3>3. Comisiones y moneda</h3><p>La comisión y su distribución deben mostrarse antes de aceptar. Los importes se mantienen en la moneda elegida para el trato (soles o dólares); no se realiza conversión automática.</p><h3>4. Reembolsos y disputas</h3><p>Un reembolso no se considera realizado hasta que el movimiento se haya ejecutado y verificado. Si hay una reclamación, la liberación queda pendiente de revisión.</p><h3>5. Estado actual de pagos</h3><p>Los pagos reales no se consideran habilitados por el mero hecho de crear una cuenta GusGus. La activación requiere integración y autorización válidas del proveedor y de las cuentas utilizadas. GusGus no debe mostrar depósitos simulados como dinero real.</p>`}};const d=docs[type];if(!d)return;$('legalOverlay')?.remove();$('app').insertAdjacentHTML('beforeend',`<div class="legal-overlay" id="legalOverlay" role="dialog" aria-modal="true" aria-label="${d.title}"><section class="legal-modal"><h2>${d.title}</h2>${d.body}<div class="legalclose"><button class="btn primary full" onclick="closeLegalDoc()">Volver al registro</button></div></section></div>`)}
function closeLegalDoc(){$('legalOverlay')?.remove()}
function homeView(){return `<section class="hero"><p>BIENVENIDO A GUSGUS</p><h1>Compra y vende con más confianza.</h1><p>Hola, ${esc(profile?.name||'usuario')}. Acompañamos tus tratos paso a paso.</p><svg class="mascot" viewBox="0 0 160 180" role="img" aria-label="Mascota GusGus"><ellipse cx="80" cy="164" rx="47" ry="9" fill="#25040e" opacity=".22"/><path d="M47 52Q43 23 80 18Q117 23 113 52L123 116Q125 143 80 146Q35 143 37 116Z" fill="#fdf9f7" stroke="#d9c4ca" stroke-width="4"/><path d="M53 55Q48 35 80 32Q112 35 107 55L105 102Q80 117 55 102Z" fill="#25131a"/><path d="M58 15Q80 -2 102 15L108 30H52Z" fill="#760f31" stroke="#f2dce3" stroke-width="3"/><path d="M80 4V-2" stroke="#f7e7eb" stroke-width="4" stroke-linecap="round"/><circle cx="80" cy="-4" r="5" fill="#f7e7eb"/><ellipse cx="68" cy="73" rx="5" ry="7" fill="#fff"/><ellipse cx="92" cy="73" rx="5" ry="7" fill="#fff"/><path d="M68 88Q80 100 92 88" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M34 89Q17 95 22 121Q27 137 43 128L48 112M126 89Q143 95 138 121Q133 137 117 128L112 112" fill="#fdf9f7" stroke="#d9c4ca" stroke-width="4" stroke-linecap="round"/><path d="M59 128L80 119L101 128L99 158H61Z" fill="#760f31"/><text x="80" y="150" font-size="23" font-weight="900" text-anchor="middle" fill="#fff">G</text></svg></section><div class="grid" style="margin-top:13px"><button class="tile" onclick="setPage('market')"><span class="tileicon">C</span><strong>Comprar</strong><small>Explora publicaciones</small></button><button class="tile" onclick="setPage('publish')"><span class="tileicon">V</span><strong>Nuevo trato</strong><small>Envía una propuesta al comprador</small></button><button class="tile" onclick="setPage('deals')"><span class="tileicon">T</span><strong>Mis tratos</strong><small>Revisa tus operaciones</small></button><button class="tile" onclick="setPage('wallet')"><span class="tileicon">S/</span><strong>Mi billetera</strong><small>Consulta tus movimientos</small></button></div><div class="card"><div class="row"><h2>Publicaciones recientes</h2><button class="link" onclick="setPage('market')">Ver todas</button></div>${listingCards(listings.slice(0,3))}</div><div class="card"><div class="row"><h2>GUSS, tu asistente</h2><button class="link" onclick="setPage('guss')">Abrir chat</button></div><p class="muted">Resuelve dudas sobre compras, ventas, tratos, comisiones y seguridad.</p></div>`}
function listingCards(items){if(!items.length)return '<div class="empty">Todavía no hay publicaciones disponibles.</div>';return items.map(x=>`<div class="product"><div class="productimg">${x.image_url?`<img src="${esc(x.image_url)}" style="width:100%;height:100%;object-fit:cover;border-radius:12px">`:'GusGus'}</div><div><h3>${esc(x.title)}</h3><div class="small">${esc(x.category||'Otros')}</div><div class="price">${money(x.price,x.currency||'PEN')}</div><div class="small">Para comprar, solicita al vendedor que te envíe una propuesta de trato.</div></div></div>`).join('')}
function marketView(){return `<div class="row"><div><h1>Comprar</h1><p class="muted">Encuentra productos publicados en GusGus.</p></div></div><input class="search" id="marketSearch" placeholder="Buscar producto o categoría" oninput="filterMarket()"><div id="marketItems">${listingCards(listings)}</div>`}
function filterMarket(){const q=$('marketSearch').value.toLowerCase();$('marketItems').innerHTML=listingCards(listings.filter(x=>(x.title+' '+x.description+' '+x.category).toLowerCase().includes(q)))}
function publishView(){return `<div class="card"><h1>Nuevo trato</h1><p class="muted">Como vendedor, prepara la propuesta y envíasela al comprador para que revise todos los datos antes de aceptar.</p><div class="field"><label>DNI del comprador</label><input id="proposalBuyerDni" inputmode="numeric" maxlength="8" placeholder="DNI del comprador"></div><div class="field"><label>Foto del producto</label><input id="proposalPhoto" type="file" accept="image/png,image/jpeg,image/webp"><p class="small">Máximo 5 MB. La imagen se mostrará en la propuesta.</p></div><div class="field"><label>Nombre del producto o servicio</label><input id="proposalTitle" maxlength="90" placeholder="Ej. Laptop gamer"></div><div class="field"><label>Categoría</label><select id="proposalCategory"><option>Tecnología</option><option>Hogar</option><option>Moda</option><option>Deportes</option><option>Servicios</option><option>Otros</option></select></div><div class="field"><label>Descripción y condiciones</label><textarea id="proposalDesc" maxlength="1500" placeholder="Describe el estado, características y condiciones del trato"></textarea></div><div class="grid"><div class="field"><label>Precio</label><input id="proposalPrice" type="number" min="0.01" step="0.01" placeholder="0.00"></div><div class="field"><label>Moneda</label><select id="proposalCurrency"><option value="PEN">Soles (S/)</option><option value="USD">Dólares (US$)</option></select></div></div><button class="btn primary full" onclick="createProposal()">Enviar propuesta al comprador</button><p class="notice">Enviar una propuesta no cobra ni mueve dinero. El comprador primero debe revisarla y aceptarla. Los pagos reales siguen desactivados.</p></div><div class="card"><h2>Mis propuestas enviadas</h2>${proposalCards(proposals.filter(x=>x.seller_id===user.id))}</div>`}
function proposalCards(items){if(!items.length)return '<div class="empty">Todavía no hay propuestas.</div>';return items.map(x=>`<div class="product"><div class="productimg">${x.image_url?`<img src="${esc(x.image_url)}" alt="Producto" style="width:100%;height:100%;object-fit:cover;border-radius:12px">`:'GusGus'}</div><div><h3>${esc(x.title)}</h3><div class="small">${esc(x.category)} · ${x.seller_id===user.id?'Enviada':'Recibida'}</div><div class="price">${money(x.amount,x.currency)}</div><span class="pill">${esc(x.status)}</span>${x.buyer_id===user.id&&x.status==='pending'?`<button class="btn primary" onclick="acceptProposal('${x.id}')">Revisar y aceptar</button>`:''}</div></div>${x.buyer_id===user.id&&x.status==='pending'?`<div class="small">${esc(x.description)}</div>`:''}`).join('')}
async function createProposal(){const buyerDni=$('proposalBuyerDni').value.trim(),title=$('proposalTitle').value.trim(),description=$('proposalDesc').value.trim(),category=$('proposalCategory').value,amount=Number($('proposalPrice').value),currency=$('proposalCurrency').value,file=$('proposalPhoto').files[0];if(!/^\d{8}$/.test(buyerDni))return alert('Escribe el DNI de 8 dígitos del comprador.');if(!title||description.length<5||!Number.isFinite(amount)||amount<=0)return alert('Completa el nombre, descripción y precio.');if(file&&(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024))return alert('Usa una imagen JPG, PNG o WEBP de máximo 5 MB.');let imageUrl=null;if(file){const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg',path=`${user.id}/${crypto.randomUUID()}.${ext}`;const {error:up}=await db.storage.from('deal-photos').upload(path,file,{contentType:file.type,upsert:false});if(up)return alert('No se pudo subir la foto: '+up.message);imageUrl=db.storage.from('deal-photos').getPublicUrl(path).data.publicUrl;}const {data,error}=await db.rpc('create_deal_proposal',{p_buyer_dni:buyerDni,p_title:title,p_description:description,p_category:category,p_amount:amount,p_currency:currency,p_image_url:imageUrl});if(error)return alert(error.message);await loadProposals();setPage('publish');alert('Propuesta enviada. El comprador debe revisarla y aceptarla.');}
async function acceptProposal(id){const proposal=proposals.find(x=>x.id===id);if(!proposal)return alert('No se encontró la propuesta.');if(!confirm(`Revisa la propuesta: ${proposal.title}\nPrecio: ${money(proposal.amount,proposal.currency)}\n\n¿Aceptas crear este trato? No se realizará ningún cobro.`))return;const {data,error}=await db.rpc('accept_deal_proposal',{p_proposal_id:id});if(error)return alert(error.message);await Promise.all([loadProposals(),loadDeals()]);alert('Propuesta aceptada. El trato quedó creado; el pago real aún no está habilitado.');setPage('deals');}
function dealsView(){return `<h1>Mis tratos</h1><p class="muted">Revisa las propuestas recibidas y el estado de tus operaciones.</p><div class="card"><h2>Propuestas por revisar</h2>${proposalCards(proposals.filter(x=>x.buyer_id===user.id))}</div><div class="card"><h2>Propuestas enviadas</h2>${proposalCards(proposals.filter(x=>x.seller_id===user.id))}</div><h2>Tratos aceptados</h2>${deals.length?deals.map(d=>`<div class="card"><div class="row"><strong>${esc(d.description||'Trato GusGus')}</strong><span class="pill">${esc(d.status||'Pendiente')}</span></div><p class="muted">${d.buyer===user.id?'Compra':'Venta'} · ${date(d.created_at)}</p><div class="row"><span class="money">${money(d.amount,d.currency||'PEN')}</span><button class="btn secondary" onclick="openDeal('${d.id}')">Ver detalle</button></div></div>`).join(''):'<div class="card empty">Todavía no tienes tratos aceptados.</div>'}`}
async function openDeal(id){selectedDeal=id;const {data,error}=await db.from('messages').select('*').eq('deal_id',id).order('created_at');if(error)console.warn(error);messages=data||[];setPage('dealDetail')}
function detailView(){const d=deals.find(x=>String(x.id)===String(selectedDeal));if(!d)return '<div class="card">Trato no encontrado.</div>';const buyer=d.buyer===user.id;return `<div class="card"><button class="link" onclick="setPage('deals')">Volver a mis tratos</button><h1>Detalle del trato</h1><div class="row"><span class="pill">${esc(d.status)}</span><span class="small">${date(d.created_at)}</span></div>${d.product_image_url?`<img src="${esc(d.product_image_url)}" alt="Foto del producto" style="width:100%;max-height:240px;object-fit:cover;border-radius:14px;margin:10px 0">`:''}<p class="money">${money(d.amount,d.currency||'PEN')}</p><p class="muted">${esc(d.description||'')}</p><div class="listrow"><span class="muted">Comisión comprador</span><strong>${money(d.fee_buyer,d.currency||'PEN')}</strong></div><div class="listrow"><span class="muted">Comisión vendedor</span><strong>${money(d.fee_seller,d.currency||'PEN')}</strong></div><p class="notice">Las acciones de pago y custodia existentes son demostrativas. No se está moviendo dinero real.</p><div class="grid"><button class="btn secondary" onclick="dealAction('${d.id}','pagar')">Confirmar pago demo</button><button class="btn secondary" onclick="dealAction('${d.id}','enviar')">Marcar envío</button><button class="btn secondary" onclick="dealAction('${d.id}','liberar')">Confirmar recepción</button><button class="btn danger" onclick="dealAction('${d.id}','disputa')">Abrir disputa</button></div><button class="btn primary full" onclick="setPage('dealChat')">Chat del trato</button></div>`}
async function dealAction(id,action){if(!confirm('¿Confirmas esta acción de demostración?'))return;const {error}=await db.rpc('deal_action',{p_deal:id,p_action:action});if(error)return alert(error.message);await loadDeals();openDeal(id)}
function dealChatView(){return `<div class="card"><button class="link" onclick="setPage('dealDetail')">Volver al trato</button><h2>Chat del trato</h2><div class="chatbox" id="dealMessages">${messages.map(m=>`<div class="bubble ${m.sender===user.id?'mine':''}">${esc(m.body)}</div>`).join('')}</div><div class="chatwrite"><input id="dealText" placeholder="Escribe un mensaje"><button class="btn primary" onclick="sendDealMessage()">Enviar</button></div></div>`}
async function sendDealMessage(){const body=$('dealText').value.trim();if(!body)return;const {error}=await db.rpc('send_message',{p_deal:selectedDeal,p_body:body});if(error)return alert(error.message);$('dealText').value='';await openDeal(selectedDeal);setPage('dealChat')}
function gussView(){const a=aiHistory();return `<div class="card"><div class="row"><div><h1>GUSS</h1><p class="muted">Asistente de GusGus · Conversación continua</p></div><button class="btn secondary" onclick="clearGuss()">Nuevo chat</button></div><div class="chatbox" id="aiMessages">${a.length?a.map(m=>`<div class="bubble ${m.role==='user'?'mine':''}">${esc(m.text)}</div>`).join(''):'<div class="bubble">Hola. Soy GUSS. Puedo ayudarte con compras, ventas, tratos y seguridad.</div>'}</div><div class="chatwrite"><input id="aiText" placeholder="Escribe tu pregunta" onkeydown="if(event.key==='Enter')sendGuss()"><button class="btn primary" id="aiSend" onclick="sendGuss()">Enviar</button></div><p class="small">GUSS conserva el historial en este dispositivo. No compartas contraseñas ni códigos de verificación.</p></div>`}
async function sendGuss(){if(aiBusy)return;const field=$('aiText'),text=field.value.trim();if(!text)return;const a=aiHistory();a.push({role:'user',text});saveAiHistory(a);field.value='';aiBusy=true;render();try{const {data:sessionData}=await db.auth.getSession();const accessToken=sessionData?.session?.access_token;if(!accessToken)throw new Error('Tu sesión expiró. Vuelve a iniciar sesión.');const response=await fetch('/api/guss',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+accessToken},body:JSON.stringify({messages:aiHistory().slice(-24)})});const data=await response.json();if(!response.ok)throw new Error(data.error||'No se pudo conectar con GUSS.');const next=aiHistory();next.push({role:'model',text:data.answer});saveAiHistory(next)}catch(e){const next=aiHistory();next.push({role:'model',text:'No pude responder en este momento: '+e.message+' Tu pregunta permanece en el historial; puedes volver a intentarlo.'});saveAiHistory(next)}finally{aiBusy=false;setPage('guss')}}
function clearGuss(){if(confirm('¿Iniciar una conversación nueva? El historial anterior se eliminará de este dispositivo.')){localStorage.removeItem(historyKey());setPage('guss')}}
function profileView(){return `<div class="card"><div class="row"><div class="avatar" id="avatarPreview">${profile?.avatar_url?`<img src="${esc(profile.avatar_url)}">`:esc((profile?.name||'U').slice(0,1).toUpperCase())}</div><div style="flex:1"><h2>${esc(profile?.name||'Usuario')}</h2><p class="muted">Cuenta personal</p></div></div><div class="field"><label>Nombre completo</label><input id="profileName" value="${esc(profile?.name||'')}"></div><div class="field"><label>Teléfono</label><input id="profileTel" value="${esc(profile?.tel||'')}"></div><div class="field"><label>Foto de perfil</label><input id="profilePhoto" type="file" accept="image/png,image/jpeg,image/webp"></div><button class="btn primary full" onclick="saveProfile()">Guardar cambios</button></div><div class="card"><h2>Mi cuenta</h2><div class="listrow"><span class="muted">Correo electrónico</span><strong>${esc(user.email)}</strong></div><div class="listrow"><span class="muted">DNI</span><strong>${esc(profile?.dni||'No registrado')}</strong></div><div class="listrow"><span class="muted">Tipo de cuenta</span><strong>Usuario</strong></div><button class="btn secondary full" onclick="setPage('wallet')">Mi billetera</button><button class="btn secondary full" onclick="setPage('settings')">Configuración y seguridad</button><button class="btn danger full" onclick="logout()">Cerrar sesión</button></div>`}
async function saveProfile(){const name=$('profileName').value.trim(),tel=$('profileTel').value.trim();if(!name)return alert('Escribe tu nombre.');const file=$('profilePhoto').files[0];let avatar_url=profile.avatar_url;if(file){if(file.size>2*1024*1024)return alert('La foto debe pesar máximo 2 MB.');const ext=file.type==='image/png'?'png':'jpg',path=`${user.id}/profile.${ext}`;const {error:up}=await db.storage.from('avatars').upload(path,file,{upsert:true,contentType:file.type});if(up)return alert('No se pudo subir la foto: '+up.message);avatar_url=path}const {data,error}=await db.from('profiles').update({name,tel,avatar_url}).eq('id',user.id).select().single();if(error)return alert(error.message);profile=data;alert('Perfil actualizado.');setPage('profile')}

function securityView(){return `<div class="card"><h1>Seguridad y privacidad</h1><p class="muted">Tu correo, DNI, teléfono y perfil no se muestran en publicaciones públicas.</p><div class="listrow">Acceso protegido por Supabase Auth.</div><div class="listrow">Los roles administrativos se validan en la base de datos.</div><div class="listrow">No compartas contraseñas ni códigos OTP.</div><button class="btn secondary full" onclick="resetFromProfile()">Cambiar contraseña por correo</button></div>`}

function creatorView(){if(!isCreator())return '<div class="card"><h1>Panel de creador</h1><p class="muted">Acceso restringido.</p></div>';const mine=listings.filter(x=>x.user_id===user.id);return `<div class="card"><h1>Panel de creador</h1><p class="muted">Gestiona tus publicaciones y revisa su actividad.</p><div class="grid3"><div><div class="stats">${mine.length}</div><div class="small">Publicaciones</div></div><div><div class="stats">${deals.length}</div><div class="small">Tratos</div></div><div><div class="stats">${money(0)}</div><div class="small">Ganancias reales</div></div></div><button class="btn primary full" onclick="setPage('publish')">Crear publicación</button>${listingCards(mine)}</div>`}
async function adminView(){if(!isStaff())return '<div class="card"><h1>Administración</h1><p class="muted">Acceso restringido.</p></div>';let usersCount='—';const {count}=await db.from('profiles').select('*',{count:'exact',head:true});if(count!==null)usersCount=count;return `<div class="card"><div class="row"><div><h1>Panel privado</h1><p class="muted">Solo personal administrativo autorizado.</p></div><span class="pill green">Acceso verificado</span></div><div class="grid3"><div><div class="stats">${usersCount}</div><div class="small">Usuarios</div></div><div><div class="stats">${deals.length}</div><div class="small">Tus tratos</div></div><div><div class="stats">${commission}%</div><div class="small">Comisión</div></div></div><div class="notice">Este panel y tu correo administrativo no aparecen en las cuentas de usuarios normales. Los permisos se validan en Supabase.</div><h2 style="margin-top:18px">Configuración de comisión</h2><div class="field"><label>Porcentaje total (%)</label><input id="commissionInput" type="number" min="0" max="30" step="0.1" value="${commission}"></div><p class="muted">La mitad corresponde al comprador y la mitad al vendedor. Cambiar este valor no modifica tratos anteriores.</p><button class="btn primary full" onclick="saveCommission()">Guardar comisión</button><h2 style="margin-top:20px">Métodos personales provisionales (privado)</h2><div class="listrow"><strong>Lemon Cash</strong><div class="small">Cuenta personal del titular · Pendiente de validación y autorización</div></div><div class="listrow"><strong>SIP</strong><div class="small">Cuenta personal del titular · Pendiente de validación y autorización</div></div><p class="notice">No se guardan CCI ni credenciales en el frontend. Métodos desactivados para pagos reales.</p><h2 style="margin-top:20px">Accesos privados</h2><button class="btn secondary full" onclick="setPage('creator')">Panel de creador</button><button class="btn secondary full" onclick="adminUsers()">Consultar usuarios</button><button class="btn secondary full" onclick="adminDeals()">Consultar todos los tratos</button></div>`}
async function saveCommission(){const n=Number($('commissionInput').value);if(!Number.isFinite(n)||n<0||n>30)return alert('Usa un porcentaje entre 0 y 30.');const {error}=await db.from('app_settings').upsert({setting_key:'commission_percent',setting_value:JSON.stringify(n),updated_at:new Date().toISOString()});if(error)return alert(error.message);commission=n;alert('Comisión actualizada.')}

async function adminDeals(){if(!isStaff())return;const {data,error}=await db.from('deals').select('*').order('created_at',{ascending:false}).limit(100);if(error)return alert(error.message);$('adminExtra').innerHTML=`<h2>Todos los tratos</h2>${(data||[]).map(d=>`<div class="listrow"><strong>${esc(d.description||'Trato')}</strong><div class="small">${money(d.amount)} · ${esc(d.status)} · ${date(d.created_at)}</div></div>`).join('')}`}
async function loadAvatar(){const img=$('avatarPreview');if(!img||!profile?.avatar_url)return;const {data,error}=await db.storage.from('avatars').createSignedUrl(profile.avatar_url,3600);if(!error&&data?.signedUrl)img.innerHTML=`<img src="${esc(data.signedUrl)}" alt="Foto de perfil">`}
function render(){if(!user)return renderAuth('login');let content='';const views={home:homeView,market:marketView,publish:publishView,deals:dealsView,dealDetail:detailView,dealChat:dealChatView,guss:gussView,profile:profileView,wallet:walletView,payments:paymentsView,history:historyView,settings:settingsView,security:securityView,notifications:notificationsView,help:helpView,terms:termsView,creator:creatorView};if(page==='admin'){shell('<div id="adminRoot">Cargando panel…</div><div id="adminExtra" class="card"></div>');adminView().then(html=>{if($('adminRoot'))$('adminRoot').innerHTML=html});return}content=views[page]?views[page]():homeView();let staffLinks='';if(isCreator())staffLinks+=`<button class="tile" onclick="setPage('creator')"><span class="tileicon">C</span><strong>Panel de creador</strong><small>Herramientas privadas</small></button>`;if(isStaff())staffLinks+=`<button class="tile" onclick="setPage('admin')"><span class="tileicon">A</span><strong>Administración</strong><small>Acceso restringido</small></button>`;if(page==='home'&&staffLinks)content+=`<div class="card"><h2>Herramientas privadas</h2><div class="grid">${staffLinks}</div></div>`;$('app').innerHTML=shell(content);if(page==='profile')loadAvatar()}
// Arranque y sesión
(async()=>{try{const {data,error}=await db.auth.getSession();if(error)throw error;if(data.session){user=data.session.user;await afterLogin()}else renderAuth('login')}catch(e){console.error(e);renderAuth('login')}})();
db.auth.onAuthStateChange(async(_event,session)=>{if(session?.user){if(!user||user.id!==session.user.id){user=session.user;await afterLogin()}}else{user=null;profile=null;roles=[];renderAuth('login')}});
</script></body></html>
