<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gus Gus Escrow - Acceso Seguro</title>
  <style>
    :root {
      --bg-color: #0F172A;
      --card-bg: #1E293B;
      --primary-cyan: #06B6D4;
      --accent-purple: #8B5CF6;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --border-color: #334155;
      --input-bg: #0F172A;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      width: 100%;
      padding: 20px 16px;
    }

    .app-card {
      background: var(--card-bg);
      padding: 28px 22px;
      border-radius: 24px;
      box-shadow: 0 0 25px rgba(6, 182, 212, 0.15);
      width: 100%;
      max-width: 400px;
      text-align: center;
      border: 1px solid var(--border-color);
    }

    /* LOGO CENTRADO CON GG */
    .logo-container {
      width: 70px;
      height: 70px;
      margin: 0 auto 16px auto;
      background: linear-gradient(135deg, var(--primary-cyan), var(--accent-purple));
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
    }

    .logo-text {
      font-size: 28px;
      font-weight: 900;
      color: #FFFFFF;
      letter-spacing: 2px;
    }

    .brand-title {
      color: var(--text-main);
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .brand-subtitle {
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 22px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--primary-cyan);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      font-size: 15px;
      color: var(--text-main);
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--primary-cyan);
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.3);
    }

    .input-code-wrapper {
      display: flex;
      gap: 8px;
    }

    .btn-submit {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--primary-cyan), var(--accent-purple));
      color: #FFFFFF;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      touch-action: manipulation;
    }

    .btn-secondary {
      display: block;
      width: 100%;
      padding: 14px;
      background-color: transparent;
      color: var(--primary-cyan);
      border: 2px solid var(--primary-cyan);
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      text-align: center;
      touch-action: manipulation;
    }

    .btn-text-action {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      padding: 10px 0;
      display: block;
      width: 100%;
      text-align: right;
      touch-action: manipulation;
    }

    .btn-code {
      background: var(--accent-purple);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 0 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    .divider {
      margin: 20px 0 16px 0;
      border-top: 1px solid var(--border-color);
    }

    .oculto { display: none !important; }

    #mensaje {
      margin-top: 16px;
      font-size: 13px;
      font-weight: 600;
    }
    .error { color: #EF4444; }
    .exito { color: #10B981; }
  </style>
</head>
<body>

  <div class="app-card">
    <!-- LOGO CENTRAL GG -->
    <div class="logo-container">
      <span class="logo-text">GG</span>
    </div>

    <h1 class="brand-title">Gus Gus</h1>
    <p class="brand-subtitle" id="subtituloCard">Plataforma de Intermediación y Custodia Digital.</p>

    <!-- INICIO DE SESIÓN -->
    <div id="vistaLogin">
      <form id="formLogin">
        <div class="form-group">
          <label>Correo Electrónico</label>
          <input type="email" id="loginEmail" placeholder="usuario@correo.com" required>
        </div>

        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>

        <button type="button" class="btn-text-action" id="btnAbrirRecuperar">¿Olvidaste tu contraseña?</button>

        <button type="submit" class="btn-submit" id="btnIngresarSubmit">INGRESAR A GUS GUS</button>
      </form>

      <div class="divider"></div>

      <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 12px;">¿Aún no tienes cuenta?</p>
      <a href="/register.html" class="btn-secondary">Crear Cuenta Nueva</a>
    </div>

    <!-- RECUPERAR CONTRASEÑA -->
    <div id="vistaRecuperar" class="oculto">
      <form id="formRecuperar">
        <div class="form-group">
          <label>Correo o Teléfono Móvil</label>
          <div class="input-code-wrapper">
            <input type="text" id="recContacto" placeholder="Correo o celular" required>
            <button type="button" class="btn-code" id="btnEnviarCodigoRec">Código</button>
          </div>
        </div>

        <div class="form-group">
          <label>Código de Verificación (6 dígitos)</label>
          <input type="text" id="recCodigo" placeholder="Ej. 123456" maxlength="6" required>
        </div>

        <div class="form-group">
          <label>Nueva Contraseña</label>
          <input type="password" id="recNuevaPass" placeholder="Mínimo 6 caracteres" minlength="6" required>
        </div>

        <button type="submit" class="btn-submit">ACTUALIZAR CONTRASEÑA</button>
      </form>

      <div class="divider"></div>

      <button type="button" class="btn-secondary" id="btnVolverLogin">Volver al Inicio</button>
    </div>

    <div id="mensaje"></div>
  </div>

  <script>
    const vistaLogin = document.getElementById('vistaLogin');
    const vistaRecuperar = document.getElementById('vistaRecuperar');
    const subtituloCard = document.getElementById('subtituloCard');
    const msg = document.getElementById('mensaje');

    document.getElementById('btnAbrirRecuperar').onclick = function() {
      vistaLogin.classList.add('oculto');
      vistaRecuperar.classList.remove('oculto');
      subtituloCard.textContent = "Ingresa tus datos para restablecer tu contraseña.";
      msg.textContent = "";
    };

    document.getElementById('btnVolverLogin').onclick = function() {
      vistaRecuperar.classList.add('oculto');
      vistaLogin.classList.remove('oculto');
      subtituloCard.textContent = "Plataforma de Intermediación y Custodia Digital.";
      msg.textContent = "";
    };

    document.getElementById('btnEnviarCodigoRec').onclick = async function() {
      const contacto = document.getElementById('recContacto').value;
      if (!contacto) {
        msg.textContent = "Ingresa tu correo o teléfono.";
        msg.className = "error";
        return;
      }

      msg.textContent = "Generando código...";
      try {
        const res = await fetch('/api/recuperar-codigo', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contacto })
        });
        const data = await res.json();
        
        if (data.codigoPrueba) {
          alert(`Tu código de prueba es: ${data.codigoPrueba}`);
          msg.textContent = `Código enviado: ${data.codigoPrueba}`;
          msg.className = "exito";
        }
      } catch (err) {
        msg.textContent = "Error al conectar con el servidor.";
        msg.className = "error";
      }
    };

    document.getElementById('formRecuperar').onsubmit = async function(e) {
      e.preventDefault();
      msg.textContent = "Procesando...";

      try {
        const res = await fetch('/api/restablecer-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contacto: document.getElementById('recContacto').value,
            codigo: document.getElementById('recCodigo').value,
            nuevaPassword: document.getElementById('recNuevaPass').value
          })
        });

        if (res.ok) {
          msg.textContent = "¡Contraseña actualizada con éxito!";
          msg.className = "exito";
          setTimeout(() => { document.getElementById('btnVolverLogin').click(); }, 1500);
        } else {
          msg.textContent = "Código o datos incorrectos.";
          msg.className = "error";
        }
      } catch (err) {
        msg.textContent = "Error de servidor.";
        msg.className = "error";
      }
    };

    // PROCESO DE LOGIN SENSIBLE A TOQUES MÓVILES
    document.getElementById('formLogin').onsubmit = async function(e) {
      e.preventDefault();
      msg.textContent = "Iniciando sesión...";
      msg.className = "";

      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok) {
          msg.textContent = "¡Bienvenido! Redirigiendo...";
          msg.className = "exito";
          localStorage.setItem('gusgus_token', data.token);
          localStorage.setItem('gusgus_user', JSON.stringify(data.user));
          window.location.href = "/dashboard";
        } else {
          msg.textContent = data.error || "Credenciales incorrectas.";
          msg.className = "error";
        }
      } catch (err) {
        msg.textContent = "Error de conexión con el servidor.";
        msg.className = "error";
      }
    };
  </script>
</body>
</html>
