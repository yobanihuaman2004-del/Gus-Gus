<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#79052f">
<title>GusGus</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<style>
:root{--wine:#79052f;--wine2:#5a0426;--neon:#ff3d81;--sheet:#f8eff3;--ink:#2d0a18;--mut:#8f6a79;--line:#f0dde5;--ok:#1fa463;--wait:#f0a020;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;background:radial-gradient(100% 60% at 80% 0,#a50e4d,transparent 60%),#3a0219;display:flex;justify-content:center;color:var(--ink)}
#app{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;background:var(--sheet);position:relative;overflow:hidden;box-shadow:0 0 60px rgba(255,61,129,.25)}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
.hidden{display:none!important}
.top{background:linear-gradient(160deg,#930c40,var(--wine2));color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 18px 54px;position:relative;overflow:hidden;flex:none}
.top.compact{padding-bottom:42px}
.top::after{content:"";position:absolute;right:-50px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,61,129,.4),transparent 70%)}
.bar{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1;min-height:40px}
.bar b{font-size:18px;font-weight:700}.ib{width:40px;height:40px;display:grid;place-items:center;color:#fff}
.bar .pill{background:rgba(255,255,255,.16);color:#fff;font-size:11px;font-weight:700;border-radius:20px;padding:5px 10px}
.who{display:flex;align-items:center;gap:12px;margin-top:6px;position:relative;z-index:1}
.who b{font-size:19px;display:block}.who small{color:#ffc2d6;font-size:13px}
.av{width:52px;height:52px;border-radius:50%;overflow:hidden;flex:none;background:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.7),0 0 16px rgba(255,61,129,.6)}
.av.nob{background:none;box-shadow:none;overflow:visible;display:grid;place-items:center}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.sheet{flex:1;overflow-y:auto;background:var(--sheet);border-radius:26px 26px 0 0;margin-top:-30px;padding:18px 16px 24px;position:relative;z-index:2}
.sheet>section{animation:fi .3s ease both}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:#fff;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 6px 22px rgba(121,5,47,.1)}
h2{font-size:20px;margin-bottom:8px}h3{font-size:16px;margin:14px 0 8px}
