<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gus Gus - Acceso Principal</title>
  <meta name="description" content="Gus Gus - Plataforma segura de intermediación.">
  <style>
    :root {
      --bg-color: #F4EFEA;
      --card-bg: #FFFFFF;
      --primary-color: #3A272D;
      --primary-hover: #2B1C21;
      --accent-color: #8C6551;
      --text-main: #231B1E;
      --text-muted: #6E6366;
      --border-color: #E2DAD5;
      --input-bg: #FAF7F5;
      --focus-ring: #8C6551;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .app-card {
      background: var(--card-bg);
      padding: 40px 28px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(58, 39, 45, 0.05);
      max-width: 420px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(226, 218, 213, 0.6);
    }

    .brand-title {
      color: var(--primary-color);
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .brand-subtitle {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      font-size: 15px;
      color: var(--text-main);
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--focus-ring);
      background-color: #FFFFFF;
    }

    .btn-submit {
      width: 100%;
      padding: 16px;
      background-color: var(--primary-color);
      color: #FFFFFF;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }

    .footer-text {
      margin-top: 24px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .footer-link {
      color: var(--accent-color);
      font-weight: 700;
      text-decoration: underline;
      cursor: pointer;
    }

    #mensaje {
      margin-top: 18px;
      font-size: 14px;
      font-weight: 600;
    }

    .error { color: #B33A3A; }
    .exito { color: #3A7A56; }
    .oculto { display: none !important; }
  </style>
</head>
<body>

  <div class="app-card">
    <h1 class="brand-title">Gus Gus</h1>
    <p class="brand-subtitle" id="subtitulo">Ingresa a tu cuenta para operar de forma segura en nuestra plataforma.</p>

    <!-- FORMULARIO 1: INICIO DE SESIÓN -->
    <div id="vistaLogin">
      <form id="formLogin">
        <div class="form-group">
          <label>Correo Electrónico</label>
          <input type="email" id="loginEmail" placeholder="tu@correo.com" required>
        </div>

        <div class="form-group">
          <label>Número de DNI</label>
          <input type="text" id="loginDni" placeholder="Ingresa tus 8 dígitos" maxlength="8" pattern="[0-9]{8}" required>
        </div>

        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-submit">Ingresar a Gus Gus</button>
      </form>

      <div class="footer-text">
        ¿No tienes una cuenta? <span class="footer-link" id="irARegistro">Regístrate aquí</span>
      </div>
    </div>

    <!-- FORMULARIO 2: REGISTRO -->
    <div id="vistaRegistro" class="oculto">
      <form id="formRegistro">
        <div class="form-group">
          <label>Nombre Completo</label>
          <input type="text" id="regNombre" placeholder="Tu nombre y apellido" required>
        </div>

        <div class="form-group">
          <label>Correo Electrónico</label>
          <input type="email" id="regEmail" placeholder="tu@correo.com" required>
        </div>

        <div class="form-group">
          <label>Número de DNI</label>
          <input type="text" id="regDni" placeholder="Ingresa tus 8 dígitos" maxlength="8" pattern="[0-9]{8}" required>
        </div>

        <div class="form-group">
          <label>Crear Contraseña</label>
          <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres" minlength="6" required>
        </div>

        <button type="submit" class="btn-submit">Crear Mi Cuenta</button>
      </form>

      <div class="footer-text">
        ¿Ya tienes una cuenta? <span class="footer-link" id="irALogin">Inicia sesión aquí</span>
      </div>
    </div>

    <div id="mensaje"></div>
  </div>

  <script>
    const vistaLogin = document.getElementById('vistaLogin');
    const vistaRegistro = document.getElementById('vistaRegistro');
    const subtitulo = document.getElementById('subtitulo');
    const irARegistro = document.getElementById('irARegistro');
    const irALogin = document.getElementById('irALogin');
    const mensaje = document.getElementById('mensaje');

    // Cambiar a Registro
    irARegistro.onclick = function() {
      vistaLogin.classList.add('oculto');
      vistaRegistro.classList.remove('oculto');
      subtitulo.textContent = "Crea tu cuenta en segundos para empezar a usar la plataforma.";
      mensaje.textContent = "";
    };

    // Cambiar a Login
    irALogin.onclick = function() {
      vistaRegistro.classList.add('oculto');
      vistaLogin.classList.remove('oculto');
      subtitulo.textContent = "Ingresa a tu cuenta para operar de forma segura en nuestra plataforma.";
      mensaje.textContent = "";
    };

    // Petición Login
    document.getElementById('formLogin').onsubmit = async function(e) {
      e.preventDefault();
      mensaje.textContent = "Verificando...";
      mensaje.className = "";

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('loginEmail').value,
            dni: document.getElementById('loginDni').value,
            password: document.getElementById('loginPassword').value
          })
        });
        const data = await res.json();
        if (res.ok) {
          mensaje.textContent = "¡Inicio de sesión exitoso!";
          mensaje.className = "exito";
        } else {
          mensaje.textContent = data.error || "Error al iniciar sesión";
          mensaje.className = "error";
        }
      } catch (err) {
        mensaje.textContent = "Error de conexión con el servidor.";
        mensaje.className = "error";
      }
    };

    // Petición Registro
    document.getElementById('formRegistro').onsubmit = async function(e) {
      e.preventDefault();
      mensaje.textContent = "Registrando usuario...";
      mensaje.className = "";

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nombre: document.getElementById('regNombre').value,
            email: document.getElementById('regEmail').value,
            dni: document.getElementById('regDni').value,
            password: document.getElementById('regPassword').value
          })
        });
        const data = await res.json();
        if (res.ok) {
          mensaje.textContent = "¡Cuenta creada! Redirigiendo...";
          mensaje.className = "exito";
          setTimeout(() => { irALogin.click(); }, 1500);
        } else {
          mensaje.textContent = data.error || "Error al registrar cuenta";
          mensaje.className = "error";
        }
      } catch (err) {
        mensaje.textContent = "Error de conexión con el servidor.";
        mensaje.className = "error";
      }
    };
  </script>

</body>
</html>
