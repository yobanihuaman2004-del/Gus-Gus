<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gus Gus - Aplicación Principal</title>
  <style>
    :root {
      --bg-dark: #12100e;
      --panel-bg: #1c1815;
      --gold: #d4af37;
      --copper: #b87333;
      --bronze: #cd7f32;
      --text: #e8d8c8;
      --border: 2px solid var(--copper);
    }
    body {
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: 'Georgia', serif;
      margin: 0;
      padding: 20px;
    }
    .header {
      border-bottom: var(--border);
      padding-bottom: 10px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 1.8rem;
      color: var(--gold);
      font-weight: bold;
    }
    .badge {
      background: var(--copper);
      color: #000;
      padding: 6px 12px;
      border-radius: 4px;
      font-weight: bold;
    }
    .card {
      background: var(--panel-bg);
      border: var(--border);
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 6px;
    }
    h2 { color: var(--bronze); margin-top: 0; }
    input[type="text"] {
      width: 100%;
      max-width: 420px;
      padding: 10px;
      background: #0d0b0a;
      border: 1px solid var(--bronze);
      color: var(--gold);
      font-family: monospace;
      font-size: 1.1rem;
    }
    button {
      background: var(--bronze);
      color: #000;
      border: none;
      padding: 10px 20px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      border-radius: 4px;
    }
    button:hover { background: var(--gold); }
    ul { list-style: square; padding-left: 20px; }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">⚙️ Gus Gus - GG Disney</div>
    <div class="badge">PANEL: ADMIN MAESTRO (CREADOR)</div>
  </div>

  <div class="card">
    <h2>Pasarela Financiera - Lemon Cash</h2>
    <p>CCI registrado para recepción de fondos:</p>
    <input type="text" id="cciInput" maxlength="21" placeholder="CCI de 21 dígitos">
    <br>
    <button onclick="guardarCCI()">Guardar CCI</button>
    <p id="cciStatus" style="color: var(--gold); font-weight: bold; margin-top: 10px;"></p>
  </div>

  <div class="card">
    <h2>Módulo de Custodia y Auditoría (Gus & Nor #2)</h2>
    <button onclick="cargarAuditoria()">Consultar Registros de Supervisión</button>
    <ul id="auditList"></ul>
  </div>

  <script>
    const USER_ROLE = "ADMIN_MAESTRO";

    async function cargarConfig() {
      try {
        const res = await fetch('/api/config');
        const data = await res.json();
        document.getElementById('cciInput').value = data.lemonCashCCI || '';
      } catch (err) {
        console.error("Error al obtener la configuración", err);
      }
    }

    async function guardarCCI() {
      const cci = document.getElementById('cciInput').value;
      const res = await fetch('/api/config/cci', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-user-role': USER_ROLE
        },
        body: JSON.stringify({ cci })
      });
      const data = await res.json();
      const statusElement = document.getElementById('cciStatus');
      if (res.ok) {
        statusElement.innerText = "✓ " + data.message;
      } else {
        statusElement.innerText = "❌ " + data.error;
      }
    }

    async function cargarAuditoria() {
      const res = await fetch('/api/audit', {
        headers: { 'x-user-role': USER_ROLE }
      });
      const data = await res.json();
      const list = document.getElementById('auditList');
      list.innerHTML = "";
      if (data.logs) {
        data.logs.forEach(log => {
          const li = document.createElement('li');
          li.innerText = `[${log.timestamp}] [${log.auditor}] - ${log.detail}`;
          list.appendChild(li);
        });
      }
    }

    cargarConfig();
  </script>
</body>
</html>
