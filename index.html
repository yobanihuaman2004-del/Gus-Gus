<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gus Gus - Acceso</title>
  <style>
    :root {
      --bg-color: #F4EFEA;
      --card-bg: #FFFFFF;
      --primary-color: #3A272D;
      --accent-color: #8C6551;
      --text-main: #231B1E;
      --text-muted: #6E6366;
      --border-color: #E2DAD5;
      --input-bg: #FAF7F5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      width: 100%;
      padding: 20px 16px;
    }

    .app-card {
      background: var(--card-bg);
      padding: 32px 20px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(58, 39, 45, 0.05);
      width: 100%;
      max-width: 400px;
      text-align: center;
      border: 1px solid rgba(226, 218, 213, 0.6);
      margin: 0 auto;
    }

    .brand-title {
      color: var(--primary-color);
      font-size: 30px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .brand-subtitle {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.4;
      margin-bottom: 24px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      font-size: 15px;
      color: var(--text-main);
      outline: none;
    }

    .input-code-wrapper {
      display: flex;
      gap: 8px;
    }

    .btn-submit {
      width: 100%;
      padding: 16px;
      background-color: var(--primary-color);
      color: #FFFFFF;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      touch-action: manipulation;
    }

    .btn-secondary {
      display: block;
      width: 100%;
      padding: 14px;
      background-color: transparent;
      color: var(--accent-color);
      border: 2px solid var(--accent-color);
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      box-sizing: border-box;
      cursor: pointer;
      text-align: center;
      touch-action: manipulation;
    }

    .btn-text-action {
      background: none;
      border: none;
      color: var(--accent-color);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      padding: 12px 0;
      display: block;
      width: 100%;
      text-align: right;
      touch-action: manipulation;
    }

    .btn-code {
      background: var(--accent-color);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 0 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      touch-action: manipulation;
    }

    .divider {
      margin: 20px 0 16px 0;
      border-top: 1px solid var(--border-color);
    }

    .oculto { display: none !important; }

    #mensaje {
      margin-top: 16px;
      font-size: 14px;
      font-weight: 600;
    }
    .error { color: #B33A3A; }
    .exito { color: #3A7A56; }
  </style>
</head>
<body>

  <div class="app-card">
    <h1 class="brand-title">Gus Gus</h1>
    <p class="brand-subtitle" id="subtituloCard">Ingresa a tu cuenta para operar de forma segura en nuestra plataforma.</p>

    <!-- FORMULARIO 1: INICIO DE SESIÓN -->
    <div id="vistaLogin">
      <form id="formLogin">
        <div class="form-group">
          <label>Correo Electrónico</label>
          <input type="email" id="loginEmail" placeholder="tu@correo.com" required>
        </div>

        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>

        <button type="button" class="btn-text-action" id="btnAbrirRecuperar">¿Olvidaste tu contraseña?</button>

        <button type="submit" class="btn-submit">Ingresar a Gus Gus</button>
      </form>

      <div class="divider"></div>

      <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 12px;">¿Aún no tienes una cuenta?</p>
      <a href="/register.html" class="btn-secondary">Crear una cuenta nueva</a>
    </div>

    <!-- FORMULARIO 2: RECUPERAR CONTRASEÑA -->
    <div id="vistaRecuperar" class="oculto">
      <form id="formRecuperar">
        <div class="form-group">
          <label>Correo o Teléfono Móvil</label>
          <div class="input-code-wrapper">
            <input type="text" id="recContacto" placeholder="Correo o celular" required>
            <button type="button" class="btn-code" id="btnEnviarCodigoRec">Enviar Código</button>
          </div>
        </div>

        <div class="form-group">
          <label>Código de Verificación (6 dígitos)</label>
          <input type="text" id="recCodigo" placeholder="Ej. 123456" maxlength="6" pattern="[0-9]{6}" required>
        </div>

        <div class="form-group">
          <label>Nueva Contraseña</label>
          <input type="password" id="recNuevaPass" placeholder="Mínimo 6 caracteres" minlength="6" required>
        </div>

        <button type="submit" class="btn-submit">Actualizar Contraseña</button>
      </form>

      <div class="divider"></div>

      <button type="button" class="btn-secondary" id="btnVolverLogin">Volver al Inicio de Sesión</button>
    </div>

    <div id="mensaje"></div>
  </div>

  <script>
    const vistaLogin = document.getElementById('vistaLogin');
    const vistaRecuperar = document.getElementById('vistaRecuperar');
    const subtituloCard = document.getElementById('subtituloCard');
    const msg = document.getElementById('mensaje');
    const btnAbrir = document.getElementById('btnAbrirRecuperar');
    const btnVolver = document.getElementById('btnVolverLogin');

    function mostrarRecuperar(e) {
      if (e) e.preventDefault();
      vistaLogin.classList.add('oculto');
      vistaRecuperar.classList.remove('oculto');
      subtituloCard.textContent = "Ingresa tu correo o teléfono para restablecer tu contraseña.";
      msg.textContent = "";
    }

    function mostrarLogin(e) {
      if (e) e.preventDefault();
      vistaRecuperar.classList.add('oculto');
      vistaLogin.classList.remove('oculto');
      subtituloCard.textContent = "Ingresa a tu cuenta para operar de forma segura en nuestra plataforma.";
      msg.textContent = "";
    }

    btnAbrir.addEventListener('click', mostrarRecuperar);
    btnVolver.addEventListener('click', mostrarLogin);

    document.getElementById('btnEnviarCodigoRec').onclick = async function() {
      const contacto = document.getElementById('recContacto').value;
      if (!contacto) {
        msg.textContent = "Ingresa tu correo o teléfono móvil.";
        msg.className = "error";
        return;
      }

      msg.textContent = "Generando código...";
      msg.className = "";

      try {
        const res = await fetch('/api/recuperar-codigo', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contacto })
        });
        const data = await res.json();
        
        if (data.codigoPrueba) {
          alert(`Tu código de prueba es: ${data.codigoPrueba}`);
          msg.textContent = `Código generado: ${data.codigoPrueba}`;
          msg.className = "exito";
        } else {
          msg.textContent = data.message || "Código enviado.";
          msg.className = "exito";
        }
      } catch (err) {
        msg.textContent = "Error al enviar código de recuperación.";
        msg.className = "error";
      }
    };

    document.getElementById('formRecuperar').onsubmit = async function(e) {
      e.preventDefault();
      msg.textContent = "Actualizando contraseña...";
      msg.className = "";

      try {
        const res = await fetch('/api/restablecer-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contacto: document.getElementById('recContacto').value,
            codigo: document.getElementById('recCodigo').value,
            nuevaPassword: document.getElementById('recNuevaPass').value
          })
        });
        const data = await res.json();

        if (res.ok) {
          msg.textContent = "¡Contraseña actualizada! Ya puedes iniciar sesión.";
          msg.className = "exito";
          setTimeout(() => { mostrarLogin(); }, 1500);
        } else {
          msg.textContent = data.error || "Error al actualizar contraseña.";
          msg.className = "error";
        }
      } catch (err) {
        msg.textContent = "Error de conexión con el servidor.";
        msg.className = "error";
      }
    };

    // FORMULARIO DE INICIO DE SESIÓN
    document.getElementById('formLogin').onsubmit = async function(e) {
      e.preventDefault();
      msg.textContent = "Verificando credenciales...";
      msg.className = "";

      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok) {
          msg.textContent = "¡Inicio de sesión exitoso! Ingresando...";
          msg.className = "exito";
          localStorage.setItem('gusgus_token', data.token);
          localStorage.setItem('gusgus_user', JSON.stringify(data.user));
          setTimeout(() => { window.location.href = "/dashboard"; }, 800);
        } else {
          msg.textContent = data.error || "Error al iniciar sesión.";
          msg.className = "error";
        }
      } catch (err) {
        msg.textContent = "Error de conexión con el servidor.";
        msg.className = "error";
      }
    };
  </script>

</body>
</html>
