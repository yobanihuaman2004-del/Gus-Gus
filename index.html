<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#450817">
<title>Gus Gus</title>
<style>
:root{
  --vino:#65152f;--vino2:#350b1d;--vino3:#9b3157;
  --fondo:#f3eadc;--panel:#fffaf2;--tinta:#35251f;
  --muted:#8c796b;--linea:#e7d8c6;--rosa:#f3e2e5;
  --beige:#e9d8c1;--marron:#72503d;--oro:#c69a5b;
  --sombra:0 14px 38px #48200f14;
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
#app{min-height:100vh;padding-bottom:94px}
.topbar{position:sticky;top:0;z-index:5;padding:14px 18px;
  background:#fbf5eced;backdrop-filter:blur(16px);
  border-bottom:1px solid var(--linea)}
.marca-cabecera{display:flex;align-items:center;gap:12px;max-width:760px;margin:auto}
.logo{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--vino3),var(--vino2));
  box-shadow:0 8px 22px #650b2230;border:1px solid #ffffff40}
.logo svg{width:34px;height:34px}
.marca{font-size:23px;font-weight:900;letter-spacing:-1px}
.lema{font-size:11px;color:var(--muted);margin-top:1px}
.contenido{max-width:760px;margin:auto;padding:20px 16px 25px}
.blk{background:var(--panel);border:1px solid var(--linea);border-radius:22px;
  padding:19px;margin:14px 0;box-shadow:var(--sombra)}
.blk h2{font-size:19px;margin:0 0 12px}
.sub{font-size:13px;color:var(--muted);line-height:1.5}
label{display:block;font-size:12px;font-weight:800;margin:15px 0 7px;color:#5d414a}
input,textarea{width:100%;border:1px solid var(--linea);border-radius:13px;
  padding:13px 14px;background:#fffdf8;color:var(--tinta);outline:none}
input:focus,textarea:focus{border-color:var(--vino3);box-shadow:0 0 0 3px #8e183e12}
input:disabled{background:#f1ecec;color:#88777d}
textarea{resize:vertical}
.btn{border:0;border-radius:13px;padding:13px 16px;font-weight:800;margin-top:13px}
.principal{background:linear-gradient(135deg,var(--vino3),var(--vino2));color:white;
  box-shadow:0 8px 20px #650b2225}
.secundario{background:var(--rosa);color:var(--vino)}
.peligro{background:#fae8e8;color:#a32635;width:100%}
.btn:disabled{opacity:.6;cursor:wait}
.fila{display:flex;align-items:center;justify-content:space-between;gap:10px}
.monto{font-size:25px;font-weight:900;color:var(--vino)}
.estado{font-size:10px;font-weight:900;padding:7px 10px;border-radius:30px;
  background:var(--rosa);color:var(--vino);white-space:nowrap}
.acciones{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.acciones .btn{margin-top:4px}
.bienvenida{padding:25px;border-radius:25px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#78132f,#350711);box-shadow:0 16px 36px #45081730}
.bienvenida h2{font-size:26px;line-height:1.15;margin:8px 0}
.bienvenida p{font-size:13px;color:#f3dce3;margin:0}
.decoracion{position:absolute;right:-28px;top:-35px;width:145px;height:145px;
  border:1px solid #ffffff30;border-radius:50%;box-shadow:0 0 0 20px #ffffff0a,0 0 0 42px #ffffff08}
.grid-quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.quick{border:1px solid var(--linea);border-radius:17px;background:white;padding:15px;
  text-align:left;color:var(--tinta);font-weight:800;box-shadow:var(--sombra)}
.quick span{display:block;font-size:22px;margin-bottom:7px}
.nav{position:fixed;z-index:8;bottom:0;left:0;right:0;display:flex;justify-content:center;
  background:#fbf5ecf2;backdrop-filter:blur(18px);border-top:1px solid var(--linea);
  padding:9px 8px calc(9px + env(safe-area-inset-bottom))}
.nav button{border:0;background:none;color:#907e84;flex:1;max-width:180px;
  font-size:11px;font-weight:800;padding:5px 2px}
.nav button span{display:block;font-size:21px;margin-bottom:3px}
.nav button.on{color:var(--vino)}
.auth{width:min(100%,430px);margin:0 auto;padding:28px 18px}
.auth-cabeza{text-align:center;margin-bottom:22px}
.auth-cabeza .logo{margin:0 auto 12px;width:62px;height:62px}
.auth-cabeza h1{font-size:32px;margin:0}
.auth-cabeza p{color:var(--muted);font-size:13px}
.link{border:0;background:none;color:var(--vino);font-weight:900;padding:8px}
.pie-auth{text-align:center;color:var(--muted);font-size:11px;margin-top:22px}
.perfil-cabeza{text-align:center;padding:8px 0 18px}
.avatar{width:94px;height:94px;border-radius:50%;margin:0 auto 12px;overflow:hidden;
  display:grid;place-items:center;background:linear-gradient(145deg,var(--vino3),var(--vino2));
  color:white;font-size:34px;border:3px solid white;box-shadow:0 5px 25px #650b2230}
.avatar img{width:100%;height:100%;object-fit:cover}
.foto-input{display:none}
.foto-ayuda{text-align:center;color:var(--muted);font-size:11px}
.mensajes{height:48vh;min-height:260px;max-height:500px;overflow:auto;
  display:flex;flex-direction:column;gap:9px;padding:12px 2px}
.mensaje{max-width:82%;padding:11px 13px;border-radius:15px;font-size:13px;overflow-wrap:anywhere}
.mensaje small{display:block;font-size:9px;opacity:.65;margin-top:5px}
.mensaje.mio{align-self:flex-end;background:var(--vino);color:white;border-bottom-right-radius:4px}
.mensaje.otro{align-self:flex-start;background:#eee2d5;border-bottom-left-radius:4px}
.chat-escribir{display:flex;gap:8px;align-items:center}
.chat-escribir input{flex:1;min-width:0}
.chat-escribir .btn{margin:0}
.aviso-demo{font-size:10px;line-height:1.5;color:var(--muted);text-align:center;padding:8px 14px}
@media(max-width:380px){.contenido{padding:14px 11px}.blk{padding:15px}.grid-quick{gap:8px}}

/* Identidad futurista Gus Gus: vino, beige, marrón y detalles champagne */
body{background:radial-gradient(ellipse at 15% 0%,#ead9c8 0,transparent 38%),var(--fondo)}
.topbar{background:#fbf5eced;border-bottom-color:#ddcbb7}
.logo{background:linear-gradient(145deg,#a84b6b,#3b0b20);border:1px solid #d7ad83;box-shadow:0 8px 25px #4b10252c}
.marca{color:var(--vino2);letter-spacing:-1.2px}.marca:after{content:' ✦';color:var(--oro);font-size:13px}
.blk,.quick{background:linear-gradient(145deg,#fffdf8,#f8efe3);border:1px solid #e7d7c4;box-shadow:0 12px 28px #48200f12, inset 0 1px #fff}
.blk{border-radius:23px}.quick{border-radius:19px;transition:transform .18s,box-shadow .18s}.quick:active{transform:scale(.98)}
.bienvenida{background:radial-gradient(circle at 85% 20%,#9b4966 0,transparent 28%),linear-gradient(135deg,#741c3b,#300817 72%);border:1px solid #b77a78;box-shadow:0 18px 40px #3a0a1d30}
.bienvenida:after{content:'✧';position:absolute;right:27px;bottom:15px;color:#e4c69b;font-size:38px;opacity:.75}.bienvenida:before{content:'GG';position:absolute;right:25px;top:22px;width:68px;height:68px;border:1px solid #e7cda455;border-radius:22px;display:grid;place-items:center;color:#f0d7ae;font-size:23px;font-weight:900;transform:rotate(10deg);box-shadow:0 0 0 9px #ffffff08,0 0 30px #d9b77e25}
.btn.principal{background:linear-gradient(115deg,#8e294e,#4b1028);border:1px solid #b8787c;box-shadow:0 7px 18px #4b10252b}
.btn.secundario{background:linear-gradient(120deg,#f2e5d4,#ead7c2);color:#5b392c;border:1px solid #e1cbb0}
.estado{background:#efe0d6;color:#6a263d;border:1px solid #e6d1c5}
.nav{background:#fbf5ecf2;border-top:1px solid #dfcbb7;box-shadow:0 -8px 25px #4b28100c}
.nav button.on{color:#8c2449}.nav button.on span{filter:drop-shadow(0 2px 4px #a64b6b40)}
input,textarea{background:#fffdf8;border-color:#e5d4c0}input:focus,textarea:focus{border-color:#a34a68;box-shadow:0 0 0 3px #a34a6818}
.monto{color:#792442}.sub{color:#877568}.perfil-cabeza h2{color:#4c2632}
.modulo-ia{display:flex;gap:13px;align-items:center;background:linear-gradient(130deg,#fffaf3,#f0e1d3);border:1px solid #e2cdb7;border-radius:21px;padding:13px;margin:11px 0;box-shadow:var(--sombra)}
.ia-avatar svg{width:100%;height:100%;display:block}.ia-avatar{width:66px;height:66px;flex:0 0 66px;border-radius:19px;display:grid;place-items:center;font-size:30px;color:#fff;background:radial-gradient(circle at 35% 25%,#bd7390,#4b1029 72%);box-shadow:inset 0 0 18px #fff3}
.ia-avatar.nort{background:radial-gradient(circle at 35% 25%,#9d9caa,#17283e 72%)}
.ia-copy{min-width:0;flex:1}.ia-copy strong{font-size:16px;display:block}.online{font-size:10px;color:#27744c;font-weight:900}.ia-copy p{font-size:11px;line-height:1.45;color:var(--muted);margin:4px 0 0}
.metricas{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metrica{background:linear-gradient(145deg,#fffdf8,#efe1d0);border:1px solid #e4d1bd;border-radius:17px;padding:14px}.metrica small{display:block;color:var(--muted);font-size:10px}.metrica b{display:block;color:var(--vino);font-size:21px;margin-top:5px}
.pill-fut{display:inline-flex;padding:5px 9px;border-radius:30px;background:#ead9c8;color:#6c3043;font-size:10px;font-weight:900}
.chatbot{height:44vh;min-height:240px;max-height:440px;overflow:auto;display:flex;flex-direction:column;gap:9px;padding:12px 2px}.chatbot .mensaje{max-width:90%}
.admin-head{background:linear-gradient(130deg,#35101f,#6d2340);color:#fff;border-radius:20px;padding:19px}.admin-head p{color:#f0dce0;font-size:12px}
@media(min-width:700px){.contenido{padding-top:26px}.grid-quick{grid-template-columns:repeat(4,1fr)}.metricas{grid-template-columns:repeat(4,1fr)}}

</style>
</head>
<body>
<div id="app"></div>
<script src="./config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script>
'use strict';

const { supabaseUrl: SUPABASE_URL, supabaseAnonKey: SUPABASE_KEY } = window.GUSGUS_CONFIG || {};
if (!SUPABASE_URL || !SUPABASE_KEY || !window.supabase) {
  document.getElementById('app').innerHTML = '<p style="padding:24px;font-family:system-ui">Falta configurar la conexión de Gus Gus. Revisa public/config.js.</p>';
  throw new Error('Configuración de Supabase incompleta.');
}
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let me=null,deals=[],msgs=[],tab='inicio',chatDeal=null,modo='login';
let timer=null,avatarFile=null,avatarPreview=null,loadingUser=false;
let filtroTratos='TODOS',consultaTratos='',gussHistory=[];

const $=id=>document.getElementById(id);
function esc(v=''){
  return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function dinero(n){return 'S/ '+Number(n||0).toFixed(2)}
function fecha(v){
  if(!v)return '';
  return new Date(v).toLocaleString('es-PE',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
}
function robotMascota(tipo='guss'){
 const nort=tipo==='nort';
 const fondo=nort?'#26384f':'#5b1832', brillo=nort?'#b9c9d9':'#e6b8c8';
 return `<svg viewBox="0 0 120 120" role="img" aria-label="Mascota ${nort?'NORT II':'GUSS'}" xmlns="http://www.w3.org/2000/svg">
 <defs><linearGradient id="rb${tipo}" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${brillo}"/><stop offset="1" stop-color="${fondo}"/></linearGradient></defs>
 <path d="M60 8v12M52 8h16" stroke="#d9b77e" stroke-width="4" stroke-linecap="round"/>
 <rect x="19" y="25" width="82" height="70" rx="25" fill="url(#rb${tipo})" stroke="#e4c99f" stroke-width="2"/>
 <rect x="29" y="38" width="62" height="42" rx="15" fill="#241a24" stroke="#e9d7c6" stroke-opacity=".65"/>
 <ellipse cx="45" cy="58" rx="6" ry="8" fill="#f7e9d5"/><ellipse cx="75" cy="58" rx="6" ry="8" fill="#f7e9d5"/>
 <path d="M48 70q12 8 24 0" fill="none" stroke="#d9b77e" stroke-width="3" stroke-linecap="round"/>
 <path d="M19 52H9M111 52h-10M42 96v8M78 96v8" stroke="#d9b77e" stroke-width="4" stroke-linecap="round"/>
 <circle cx="60" cy="14" r="4" fill="#e9c78f"/>
 </svg>`;
}
function logo(){
 return `<div class="logo"><svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
 <path d="M13 38L29 25L43 34L55 29L70 36L87 29M13 38L29 54L43 43L55 50L70 36M29 54L43 68L55 58L70 65L87 49M43 43L55 58" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;
}
async function rpc(nombre,parametros={}){
 const {data,error}=await db.rpc(nombre,parametros);
 if(error)throw error;
 return data;
}

async function cargarUsuario(user){
 if(loadingUser)return;
 loadingUser=true;
 try{
  const {data,error}=await db.from('profiles').select('*').eq('id',user.id).single();
  if(error)throw error;
  me={...data,email:user.email,id:user.id};
  await cargarTratos();
  render();
 }catch(error){
  console.error(error);
  alert('No se pudo cargar tu perfil: '+error.message);
 }finally{loadingUser=false}
}
async function cargarTratos(){
 if(!me)return;
 const {data,error}=await db.from('deals').select('*')
  .or(`buyer.eq.${me.id},seller.eq.${me.id}`)
  .order('created_at',{ascending:false});
 if(error){console.error(error);deals=[];return}
 deals=data||[];
}
async function cargarMsgs(id){
 if(!id)return;
 const {data,error}=await db.from('messages').select('*')
  .eq('deal_id',id).order('created_at',{ascending:true});
 if(error){console.error(error);return}
 msgs=data||[];
 pintarChat();
}
async function actualizar(){
 if(!me)return;
 await cargarTratos();render();
 if(chatDeal)await cargarMsgs(chatDeal);
}
function iniciarActualizacion(){
 if(timer)clearInterval(timer);
 timer=setInterval(async()=>{
  if(me){await cargarTratos();if(chatDeal)await cargarMsgs(chatDeal);else render()}
 },10000);
}
async function doLogin(){
 const email=$('email')?.value.trim(),password=$('password')?.value;
 if(!email||!password){alert('Escribe tu correo y contraseña.');return}
 const btn=$('btnAuth');if(btn){btn.disabled=true;btn.textContent='Ingresando...'}
 const {data,error}=await db.auth.signInWithPassword({email,password});
 if(error){alert('No se pudo ingresar: '+error.message);if(btn){btn.disabled=false;btn.textContent='Ingresar'};return}
 await cargarUsuario(data.user);iniciarActualizacion();
}
async function doReg(){
 const nombre=$('nombre')?.value.trim(),email=$('email')?.value.trim(),password=$('password')?.value;
 if(!nombre||!email||!password){alert('Completa todos los campos.');return}
 if(password.length<6){alert('La contraseña debe tener al menos 6 caracteres.');return}
 const btn=$('btnAuth');if(btn){btn.disabled=true;btn.textContent='Creando cuenta...'}
 const {data,error}=await db.auth.signUp({email,password,options:{data:{name:nombre}}});
 if(error){alert('No se pudo crear la cuenta: '+error.message);if(btn){btn.disabled=false;btn.textContent='Crear cuenta'};return}
 if(data.session&&data.user){await cargarUsuario(data.user);iniciarActualizacion()}
 else{alert('Cuenta creada. Revisa tu correo para confirmar el registro.');modo='login';render()}
}
async function salir(){
 if(timer)clearInterval(timer);timer=null;
 me=null;deals=[];msgs=[];chatDeal=null;
 await db.auth.signOut();render();
}

// FOTO DE PERFIL: el bucket avatars debe ser privado.
function previsualizarAvatar(input){
 const archivo=input.files?.[0];if(!archivo)return;
 if(!['image/jpeg','image/png','image/webp'].includes(archivo.type)){
  alert('Usa una imagen JPG, PNG o WEBP.');input.value='';return;
 }
 if(archivo.size>2*1024*1024){alert('La imagen no puede superar 2 MB.');input.value='';return}
 avatarFile=archivo;
 if(avatarPreview)URL.revokeObjectURL(avatarPreview);
 avatarPreview=URL.createObjectURL(archivo);
 const img=$('avatar_img'),placeholder=$('avatar_placeholder');
 if(img){img.src=avatarPreview;img.style.display='block'}
 if(placeholder)placeholder.style.display='none';
}
async function mostrarAvatar(){
 if(!me)return;
 const img=$('avatar_img'),placeholder=$('avatar_placeholder');
 if(!img)return;
 if(avatarPreview){img.src=avatarPreview;img.style.display='block';if(placeholder)placeholder.style.display='none';return}
 if(!me.avatar_url){img.style.display='none';if(placeholder)placeholder.style.display='block';return}
 const {data,error}=await db.storage.from('avatars').createSignedUrl(me.avatar_url,3600);
 if(error||!data?.signedUrl){img.style.display='none';if(placeholder)placeholder.style.display='block';return}
 img.src=data.signedUrl;img.style.display='block';if(placeholder)placeholder.style.display='none';
}
async function subirAvatar(){
 if(!avatarFile||!me)return me?.avatar_url||null;
 const extension=avatarFile.type==='image/png'?'png':avatarFile.type==='image/webp'?'webp':'jpg';
 const ruta=`${me.id}/foto.${extension}`;
 const {error}=await db.storage.from('avatars').upload(ruta,avatarFile,{upsert:true,contentType:avatarFile.type});
 if(error)throw error;
 return ruta;
}
async function guardarPerfil(){
 if(!me)return;
 const nombre=$('perfil_nombre')?.value.trim(),telefono=$('perfil_tel')?.value.trim();
 if(!nombre){alert('Escribe tu nombre.');return}
 const btn=$('btnGuardarPerfil');if(btn){btn.disabled=true;btn.textContent='Guardando...'}
 try{
  const avatarPath=await subirAvatar();
  const {data,error}=await db.from('profiles')
   .update({name:nombre,tel:telefono,avatar_url:avatarPath})
   .eq('id',me.id).select().single();
  if(error)throw error;
  me={...me,...data};avatarFile=null;
  if(avatarPreview){URL.revokeObjectURL(avatarPreview);avatarPreview=null}
  alert('Perfil actualizado correctamente.');render();
 }catch(error){console.error(error);alert('No se pudo guardar el perfil: '+error.message)}
 finally{if(btn){btn.disabled=false;btn.textContent='Guardar cambios'}}
}
async function recargar(){
 if(!confirm('Se agregarán S/ 100.00 de saldo DEMOSTRATIVO. No se moverá dinero real. ¿Continuar?'))return;
 try{await rpc('demo_topup');await cargarUsuario({id:me.id,email:me.email});alert('Recarga demostrativa realizada.')}
 catch(error){console.error(error);alert('No se pudo realizar la recarga: '+error.message)}
}

// TRATOS. Las acciones deben coincidir con la función deal_action de Supabase.
async function crear(){
 const dni=$('seller_dni')?.value.trim(),amount=Number($('deal_amount')?.value),desc=$('deal_desc')?.value.trim(),categoria=$('deal_category')?.value||'Otros';
 if(!/^\d{8}$/.test(dni||'')){alert('El DNI del vendedor debe tener 8 dígitos.');return}
 if(!Number.isFinite(amount)||amount<=0||!desc){alert('Completa una descripción y un monto válido.');return}
 try{
  await rpc('create_deal',{p_seller_dni:dni,p_amount:amount,p_desc:`[${categoria}] ${desc}`});
  alert('Solicitud de trato creada.');await actualizar();
 }catch(error){console.error(error);alert('No se pudo crear el trato: '+error.message)}
}
async function act(id,accion){
 if(!confirm('¿Confirmas esta acción?'))return;
 try{await rpc('deal_action',{p_deal:id,p_action:accion});await actualizar()}
 catch(error){console.error(error);alert('No se pudo realizar la acción: '+error.message)}
}
function botones(d){
 const comprador=d.buyer===me.id,estado=d.status;let html='';
 if(estado==='PENDIENTE'){
  if(comprador){
   html+=`<button class="btn principal" onclick="act('${d.id}','pagar')">Pagar (demo)</button>`;
   html+=`<button class="btn secundario" onclick="act('${d.id}','cancelar')">Cancelar</button>`;
  }else{
   html+='<p class="sub">Esperando el pago demostrativo del comprador.</p>';
   html+=`<button class="btn secundario" onclick="act('${d.id}','cancelar')">Cancelar</button>`;
  }
 }
 if(estado==='EN_CUSTODIA'&&!comprador)html+=`<button class="btn principal" onclick="act('${d.id}','enviar')">Confirmar envío</button>`;
 if(estado==='EN_CUSTODIA'&&comprador)html+='<p class="sub">Pago de demostración registrado. Esperando el envío.</p>';
 if(estado==='ENVIADO'&&comprador){
  html+=`<button class="btn principal" onclick="act('${d.id}','liberar')">Confirmar recepción</button>`;
  html+=`<button class="btn secundario" onclick="act('${d.id}','disputa')">Abrir disputa</button>`;
 }
 if(estado==='ENVIADO'&&!comprador)html+='<p class="sub">Envío confirmado. Esperando recepción del comprador.</p>';
 if(estado==='DISPUTA'){
  html+='<p class="sub">El trato está en revisión.</p>';
  if(!comprador)html+=`<button class="btn secundario" onclick="act('${d.id}','devolver')">Devolver saldo de prueba</button>`;
 }
 return html;
}
function card(d){
 const comprador=d.buyer===me.id;
 const otra=comprador?(d.seller_name||'Vendedor'):(d.buyer_name||'Comprador');
 return `<div class="blk">
  <div class="fila"><strong>${esc(d.description||'Trato Gus Gus')}</strong><span class="estado">${esc(d.status||'')}</span></div>
  <p class="sub">${comprador?'Vendedor':'Comprador'}: ${esc(otra)}</p>
  <div class="fila"><strong class="monto">${dinero(d.amount)}</strong><span class="sub">${fecha(d.created_at)}</span></div>
  <div class="acciones">${botones(d)}<button class="btn secundario" onclick="abrirChat('${d.id}')">Abrir chat</button></div>
 </div>`;
}

// CHAT
async function abrirChat(id){chatDeal=id;tab='chat';await cargarMsgs(id);render();pintarChat()}
function pintarChat(){
 const zona=$('mensajes');if(!zona)return;
 zona.innerHTML=msgs.map(m=>`<div class="mensaje ${m.sender===me.id?'mio':'otro'}">
  <div>${esc(m.body||'')}</div><small>${fecha(m.created_at)}</small></div>`).join('');
 zona.scrollTop=zona.scrollHeight;
}
async function enviar(){
 const campo=$('mensaje_texto'),texto=campo?.value.trim();if(!texto||!chatDeal)return;
 campo.value='';
 try{await rpc('send_message',{p_deal:chatDeal,p_body:texto});await cargarMsgs(chatDeal)}
 catch(error){console.error(error);alert('No se pudo enviar el mensaje: '+error.message)}
}

// GUSS: asistente de orientación y prevención. No sustituye una IA generativa ni verifica pagos.
function respuestaGuss(texto){
 const t=texto.toLowerCase();
 if(/pagu[eé]|yape|plin|transfer|dep[oó]sit/.test(t))return 'Antes de entregar un producto, confirma que el pago figure dentro de Gus Gus. No confíes solo en capturas, correos o mensajes enviados por la otra persona. La conexión de pagos reales se habilitará cuando se configure Izipay.';
 if(/estafa|fraude|sospech|scam|enga[ñn]/.test(t))return 'Señales de alerta: presión para salir del chat, enlaces extraños, comprobantes editados, pedidos de claves o códigos y cambios de cuenta de último minuto. Detén el trato y conserva los mensajes. Si ya existe un trato, usa la opción de disputa.';
 if(/comisi[oó]n|cobro|fee/.test(t))return 'La comisión del trato se calcula en el flujo actual de Supabase. La configuración administrativa del porcentaje requiere completar y validar la función segura en la base de datos.';
 if(/disputa|problema|reclamo|no lleg[oó]|no recib/.test(t))return 'Abre el trato correspondiente y selecciona “Abrir disputa” si está disponible. No confirmes la recepción hasta comprobar el producto o servicio. Conserva fotos y conversaciones como evidencia.';
 if(/crear|trato|comprar|vender/.test(t))return 'Para crear un trato necesitas el DNI del vendedor, el monto y una descripción clara. Revisa los datos antes de enviar la solicitud y mantén la conversación dentro de Gus Gus.';
 if(/contrase[ñn]a|clave|c[oó]digo/.test(t))return 'Nunca compartas tu contraseña, códigos SMS, PIN de Yape/Plin ni datos completos de tarjeta. El equipo de Gus Gus no debe pedirte esos secretos.';
 return 'Puedo orientarte sobre cómo crear tratos, usar el chat y reconocer señales de estafa. Cuéntame qué necesitas hacer y te guío paso a paso.';
}
function enviarGuss(){const input=$('guss_texto');const q=input?.value.trim();if(!q)return;gussHistory.push({q,a:respuestaGuss(q)});input.value='';renderGussChat()}
function renderGussChat(){const z=$('guss_mensajes');if(!z)return;z.innerHTML='<div class="mensaje otro">Hola, soy GUSS. Puedo orientarte y ayudarte a detectar señales de riesgo. Nunca compartas claves ni códigos.<small>Asistente Gus Gus</small></div>'+gussHistory.map(x=>`<div class="mensaje mio">${esc(x.q)}</div><div class="mensaje otro">${esc(x.a)}<small>Orientación automática</small></div>`).join('');z.scrollTop=z.scrollHeight}
function abrirGuss(){tab='guss';render()}
function vGuss(){return `<div class="blk"><div class="fila"><div style="display:flex;align-items:center;gap:10px"><div class="ia-avatar">${robotMascota('guss')}</div><h2>GUSS · Tu asistente</h2></div><span class="pill-fut">● ACTIVO</span></div><p class="sub">Te orienta dentro de Gus Gus y te ayuda a reconocer señales comunes de fraude.</p><div class="chatbot" id="guss_mensajes"><div class="mensaje otro">Hola, soy GUSS. Puedo orientarte y ayudarte a detectar señales de riesgo. Nunca compartas claves ni códigos.<small>Asistente Gus Gus</small></div></div><div class="chat-escribir"><input id="guss_texto" placeholder="Pregúntame algo..." onkeydown="if(event.key==='Enter')enviarGuss()"><button class="btn principal" onclick="enviarGuss()">➤</button></div><p class="aviso-demo">Orientación automática inicial; no es asesoría legal ni verificación automática de identidad o pagos.</p></div>`}
function vNort(){
 const total=deals.length,terminados=deals.filter(d=>['COMPLETADO','CERRADO','FINALIZADO'].includes(d.status)).length,abiertos=deals.filter(d=>['PENDIENTE','EN_CUSTODIA','ENVIADO','DISPUTA'].includes(d.status)).length,disputas=deals.filter(d=>d.status==='DISPUTA').length,volumen=deals.reduce((a,d)=>a+Number(d.amount||0),0);
 return `<div class="blk"><div class="fila"><div style="display:flex;align-items:center;gap:10px"><div class="ia-avatar nort">${robotMascota('nort')}</div><h2>NORT II</h2></div><span class="pill-fut">ANÁLISIS</span></div><p class="sub">Tu segundo asistente: resumen de actividad y señales de atención calculadas con los tratos visibles de tu cuenta.</p><div class="metricas"><div class="metrica"><small>Tratos visibles</small><b>${total}</b></div><div class="metrica"><small>En curso</small><b>${abiertos}</b></div><div class="metrica"><small>En disputa</small><b>${disputas}</b></div><div class="metrica"><small>Finalizados</small><b>${terminados}</b></div><div class="metrica"><small>Volumen registrado</small><b>${dinero(volumen)}</b></div></div><div class="blk" style="margin:14px 0 0"><h2>Supervisión</h2><p class="sub">${disputas?`Tienes ${disputas} trato(s) en disputa. Revisa sus conversaciones y evidencias.`:'No aparecen disputas entre los tratos visibles.'}</p><p class="sub">${abiertos?`${abiertos} trato(s) requieren seguimiento.`:'No hay tratos pendientes de seguimiento.'}</p><p class="sub">Los importes son datos de los tratos visibles; no representan fondos custodiados ni ganancias de Gus Gus.</p></div></div>`;
}
function vBuscar(){return `<div class="blk"><h2>Buscar en mis tratos</h2><p class="sub">Filtra tus operaciones registradas.</p><input id="buscar_trato" value="${esc(consultaTratos)}" placeholder="Buscar por descripción o estado" oninput="consultaTratos=this.value;actualizarListaBusqueda()"><div id="resultados_busqueda">${listaBusqueda()}</div></div>`}
function listaBusqueda(){const q=consultaTratos.toLowerCase();const arr=deals.filter(d=>(d.description||'').toLowerCase().includes(q)||(d.status||'').toLowerCase().includes(q));return arr.length?arr.map(card).join(''):'<p class="sub">No hay coincidencias en tus tratos.</p>'}
function actualizarListaBusqueda(){const z=$('resultados_busqueda');if(z)z.innerHTML=listaBusqueda()}
function vAdmin(){return `<div class="blk"><div class="admin-head"><strong>♛ Panel de administración</strong><p>Vista de control habilitada solo para correos autorizados en configuración.</p></div><div class="metricas"><div class="metrica"><small>Tratos visibles</small><b>${deals.length}</b></div><div class="metrica"><small>En disputa</small><b>${deals.filter(d=>d.status==='DISPUTA').length}</b></div><div class="metrica"><small>Volumen visible</small><b>${dinero(deals.reduce((a,d)=>a+Number(d.amount||0),0))}</b></div><div class="metrica"><small>Comisión registrada</small><b>${dinero(deals.reduce((a,d)=>a+Number(d.fee_buyer||0)+Number(d.fee_seller||0),0))}</b></div></div><p class="sub">Esta primera vista usa únicamente datos que las políticas RLS permiten consultar. No permite bloquear usuarios ni modificar saldos. Esas acciones requieren permisos y funciones administrativas seguras en Supabase.</p></div>`}

// VISTAS
function vInicio(){
 const admin=(window.GUSGUS_CONFIG?.adminEmails||[]).includes((me.email||'').toLowerCase());
 return `<div class="bienvenida"><div class="decoracion"></div><p>BIENVENIDO A GUS GUS ✦</p><h2>Compra. Vende. Confía.</h2><p>Tu espacio para hacer tratos con más claridad y acompañamiento.</p></div>
 <div class="blk"><div class="fila"><div><p class="sub">MI SALDO · DEMOSTRACIÓN</p><div class="monto">${dinero(me.balance)}</div></div><span class="pill-fut">CUENTA ACTIVA</span></div><p class="sub">Los fondos reales se habilitarán cuando se conecte y valide Izipay.</p></div>
 <div class="modulo-ia"><div class="ia-avatar">${robotMascota('guss')}</div><div class="ia-copy"><strong>GUSS <span class="online">● Activo</span></strong><p>Te orienta y te advierte sobre señales comunes de estafa.</p><button class="btn principal" onclick="abrirGuss()">Hablar con GUSS ›</button></div></div>
 <div class="modulo-ia"><div class="ia-avatar nort">${robotMascota('nort')}</div><div class="ia-copy"><strong>NORT II <span class="online">● Activo</span></strong><p>Tu segundo asistente: actividad, seguimiento y alertas de tus tratos.</p><button class="btn secundario" onclick="go('nort')">Ver mi análisis ›</button></div></div>
 <div class="grid-quick"><button class="quick" onclick="go('crear')"><span>＋</span>Crear trato</button><button class="quick" onclick="go('buscar')"><span>⌕</span>Buscar</button><button class="quick" onclick="go('mis')"><span>🤝</span>Mis tratos</button><button class="quick" onclick="go('chat')"><span>▤</span>Mis chats</button><button class="quick" onclick="go('perfil')"><span>♙</span>Mi perfil</button>${admin?'<button class="quick" onclick="go(\'admin\')"><span>♛</span>Administración</button>':''}</div>
 <div class="blk"><div class="fila"><h2>Actividad reciente</h2><button class="link" onclick="go('mis')">Ver todos</button></div>${deals.length?deals.slice(0,3).map(card).join(''):'<p class="sub">Todavía no tienes tratos. Crea tu primera solicitud.</p>'}</div>`;
}
function vTratos(){
 return `<div class="blk"><h2>Crear un trato</h2><p class="sub">Ingresa los datos del vendedor.</p>
 <label>DNI del vendedor</label><input id="seller_dni" inputmode="numeric" maxlength="8" placeholder="DNI del vendedor">
 <label>Categoría</label><select id="deal_category" style="width:100%;padding:13px;border:1px solid var(--linea);border-radius:13px;background:#fffdf8;color:var(--tinta)"><option>Producto</option><option>Servicio</option><option>Electrónica</option><option>Moda</option><option>Hogar</option><option>Vehículos</option><option>Otros</option></select>
 <label>Monto del trato (S/)</label><input id="deal_amount" type="number" min="0.01" step="0.01" placeholder="Ej. 150">
 <label>Descripción</label><textarea id="deal_desc" rows="3" placeholder="Describe el producto o servicio"></textarea>
 <button class="btn principal" onclick="crear()">Publicar trato</button><p class="aviso-demo">La categoría se muestra para organizar tu solicitud; el esquema actual guarda la descripción y el monto.</p></div>`;
}
function vChat(){
 if(!deals.length)return `<div class="blk"><h2>Mis chats</h2><p class="sub">El chat se abre desde un trato. Crea uno primero.</p></div>`;
 if(!chatDeal)return `<div class="blk"><h2>Mis chats</h2><p class="sub">Selecciona un trato para abrir su conversación.</p>
 ${deals.map(d=>`<button class="quick" style="width:100%;margin:5px 0" onclick="abrirChat('${d.id}')"><span>💬</span>${esc(d.description||'Trato')}<small>${esc(d.status||'')}</small></button>`).join('')}</div>`;
 const d=deals.find(x=>x.id===chatDeal);
 return `<div class="blk"><div class="fila"><h2>Chat del trato</h2><button class="btn secundario" onclick="chatDeal=null;render()">Volver</button></div>
 <p class="sub">${esc(d?.description||'Conversación')}</p><div id="mensajes" class="mensajes">
 ${msgs.map(m=>`<div class="mensaje ${m.sender===me.id?'mio':'otro'}"><div>${esc(m.body||'')}</div><small>${fecha(m.created_at)}</small></div>`).join('')}
 </div><div class="chat-escribir"><input id="mensaje_texto" placeholder="Escribe un mensaje..." onkeydown="if(event.key==='Enter')enviar()">
 <button class="btn principal" onclick="enviar()">➤</button></div></div>`;
}
function vPerfil(){
 return `<div class="blk"><div class="perfil-cabeza"><div class="avatar">
 <img id="avatar_img" alt="Foto de perfil" style="display:none"><span id="avatar_placeholder">👤</span></div>
 <h2>${esc(me.name||'Usuario')}</h2><p class="sub">${esc(me.email||'')}</p></div>
 <label>Foto de perfil</label><input class="foto-input" id="foto_archivo" type="file" accept="image/png,image/jpeg,image/webp" onchange="previsualizarAvatar(this)">
 <button class="btn secundario" onclick="$('foto_archivo').click()">Cambiar foto</button>
 <p class="foto-ayuda">JPG, PNG o WEBP. Máximo 2 MB.</p>
 <label>Nombre completo</label><input id="perfil_nombre" value="${esc(me.name||'')}" placeholder="Tu nombre">
 <label>Teléfono</label><input id="perfil_tel" value="${esc(me.tel||'')}" placeholder="Tu teléfono"><label>DNI</label><input value="${esc(me.dni||'')}" disabled><label>Yape</label><input value="${esc(me.yape||'')}" disabled><label>Plin</label><input value="${esc(me.plin||'')}" disabled>
 <label>Correo electrónico</label><input value="${esc(me.email||'')}" disabled>
 <button id="btnGuardarPerfil" class="btn principal" onclick="guardarPerfil()">Guardar cambios</button></div>
 <div class="blk"><h2>Mi saldo</h2><div class="monto">${dinero(me.balance)}</div>
 <p class="sub">Saldo demostrativo. No es dinero real.</p>
 <p class="sub">La función de prueba existente agrega S/ 100.00. No mueve dinero real.</p>
 <button class="btn secundario" onclick="recargar()">Agregar S/ 100 de prueba</button></div>
 <div class="blk"><button class="btn peligro" onclick="salir()">Cerrar sesión</button></div>`;
}
function go(t){
 tab=t;chatDeal=null;
 if(avatarPreview){URL.revokeObjectURL(avatarPreview);avatarPreview=null}
 avatarFile=null;render();
}
function render(){
 const app=$('app');if(!app)return;
 if(!me){
  app.innerHTML=`<div class="auth"><div class="auth-cabeza">${logo()}<h1>Gus Gus</h1>
  <p>Tratos seguros, de principio a fin.</p></div><div class="blk">
  <h2>${modo==='login'?'Bienvenido de nuevo':'Crear cuenta'}</h2>
  <p class="sub">${modo==='login'?'Ingresa a tu cuenta':'Regístrate para comenzar'}</p>
  ${modo==='registro'?'<label>Nombre completo</label><input id="nombre" placeholder="Tu nombre">':''}
  <label>Correo electrónico</label><input id="email" type="email" placeholder="correo@ejemplo.com">
  <label>Contraseña</label><input id="password" type="password" placeholder="Tu contraseña">
  <button id="btnAuth" class="btn principal" onclick="${modo==='login'?'doLogin()':'doReg()'}">${modo==='login'?'Ingresar':'Crear cuenta'}</button>
  <p class="sub">${modo==='login'?'¿No tienes cuenta?':'¿Ya tienes cuenta?'}
  <button class="link" onclick="modo='${modo==='login'?'registro':'login'}';render()">${modo==='login'?'Regístrate':'Inicia sesión'}</button></p>
  </div><p class="pie-auth">Gus Gus · Plataforma de tratos</p></div>`;
  return;
 }
 const vistas={inicio:vInicio,buscar:vBuscar,crear:vTratos,mis:()=>`<div class="blk"><h2>Mis tratos</h2>${deals.length?deals.map(card).join(''):'<p class="sub">Aún no tienes tratos.</p>'}</div>`,tratos:vTratos,chat:vChat,perfil:vPerfil,guss:vGuss,nort:vNort,admin:vAdmin};
 const autorizado=(window.GUSGUS_CONFIG?.adminEmails||[]).includes((me.email||'').toLowerCase());if(tab==='admin'&&!autorizado)tab='inicio';
 app.innerHTML=`<header class="topbar"><div class="marca-cabecera">${logo()}<div><div class="marca">Gus Gus</div><div class="lema">Tratos seguros</div></div></div></header>
 <main class="contenido">${vistas[tab]?vistas[tab]():vInicio()}
 <p class="aviso-demo">Gus Gus está en etapa de desarrollo. El saldo y las recargas son demostrativos. No se realizan pagos ni transferencias reales.</p></main>
 <nav class="nav">
 <button class="${tab==='inicio'?'on':''}" onclick="go('inicio')"><span>⌂</span>Inicio</button>
 <button class="${tab==='buscar'?'on':''}" onclick="go('buscar')"><span>⌕</span>Buscar</button>
 <button class="${tab==='crear'?'on':''}" onclick="go('crear')"><span>＋</span>Crear</button>
 <button class="${tab==='mis'?'on':''}" onclick="go('mis')"><span>♜</span>Mis tratos</button>
 <button class="${tab==='perfil'?'on':''}" onclick="go('perfil')"><span>♙</span>Perfil</button></nav>`;
 if(tab==='perfil')mostrarAvatar();
}

db.auth.onAuthStateChange((event,session)=>{
 if(session?.user){
  if(!me||me.id!==session.user.id){cargarUsuario(session.user).then(iniciarActualizacion)}
 }else if(event==='SIGNED_OUT'){
  me=null;deals=[];msgs=[];if(timer)clearInterval(timer);timer=null;render();
 }
});
(async()=>{
 const {data,error}=await db.auth.getSession();
 if(error)console.error(error);
 if(data.session){await cargarUsuario(data.session.user);iniciarActualizacion()}
 else render();
})();
</script>
</body>
</html>
