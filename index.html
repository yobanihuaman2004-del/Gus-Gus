<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gus Gus - Aplicación Principal</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e24;
      --accent: #ffb703;
      --text: #e0e0e0;
      --border: 1px solid #333344;
      --admin-badge: #d4af37;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: var(--border);
      padding-bottom: 15px;
      margin-bottom: 25px;
    }
    .logo {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .role-selector {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    select {
      background: #000;
      color: var(--accent);
      border: var(--border);
      padding: 8px 12px;
      border-radius: 4px;
      font-weight: bold;
    }
    .card {
      background: var(--card-bg);
      border: var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    h2 {
      color: var(--accent);
      margin-top: 0;
    }
    input[type="text"], textarea {
      width: 100%;
      max-width: 400px;
      padding: 10px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #000;
      color: #fff;
      font-size: 1rem;
      margin-bottom: 10px;
    }
    button {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 10px 20px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      opacity: 0.9;
    }
    .status-msg {
      margin-top: 10px;
      font-weight: bold;
    }
    .admin-only {
      display: none;
      border-left: 4px solid var(--admin-badge);
    }
    ul {
      padding-left: 20px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">🐭 Gus Gus</div>
    <div class="role-selector">
      <label for="roleSelect">Vista Actual:</label>
      <select id="roleSelect" onchange="cambiarRol()">
        <option value="ADMIN_MAESTRO">Creador / Admin Maestro</option>
        <option value="USUARIO_ESTANDAR">Usuario Estándar</option>
      </select>
    </div>
  </div>

  <div class="card">
    <h2>Módulo Financiero - Lemon Cash</h2>
    <p>CCI registrado para la cuenta Gus Gus (20 dígitos):</p>
    <input type="text" id="cciInput" maxlength="20" placeholder="Ej: 92200300000022201629">
    <br>
    <button onclick="guardarCCI()">Actualizar CCI (Solo Admin)</button>
    <div id="cciStatus" class="status-msg"></div>
  </div>

  <div class="card admin-only" id="adminPanel">
    <h2>Panel Exclusivo Creador - Supervisión Gus & Nor #2</h2>
    <p>Logs y eventos del sistema en tiempo real:</p>
    <button onclick="cargarAuditoria()">Cargar Logs de Auditoría</button>
    <ul id="auditList"></ul>
  </div>

  <div class="card">
    <h2>Centro de Ayuda y Mensajería</h2>
    <p>Envía un mensaje directo al Administrador Maestro:</p>
    <textarea id="msgInput" rows="3" placeholder="Escribe tu consulta..."></textarea>
    <br>
    <button onclick="enviarMensaje()">Enviar Mensaje</button>
    <div id="msgStatus" class="status-msg"></div>
  </div>

  <script>
    let currentRole = "ADMIN_MAESTRO";

    function cambiarRol() {
      currentRole = document.getElementById('roleSelect').value;
      const adminPanel = document.getElementById('adminPanel');
      if (currentRole === 'ADMIN_MAESTRO') {
        adminPanel.style.display = 'block';
      } else {
        adminPanel.style.display = 'none';
      }
    }

    async function cargarConfig() {
      try {
        const res = await fetch('/api/config');
        const data = await res.json();
        document.getElementById('cciInput').value = data.lemonCashCCI || '';
      } catch (err) {
        console.error("Error al cargar configuración", err);
      }
    }

    async function guardarCCI() {
      const cci = document.getElementById('cciInput').value;
      const statusDiv = document.getElementById('cciStatus');
      
      const res = await fetch('/api/config/cci', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-user-role': currentRole
        },
        body: JSON.stringify({ cci })
      });
      
      const data = await res.json();
      if (res.ok) {
        statusDiv.style.color = '#4caf50';
        statusDiv.innerText = "✓ " + data.message;
      } else {
        statusDiv.style.color = '#f44336';
        statusDiv.innerText = "❌ " + data.error;
      }
    }

    async function cargarAuditoria() {
      const list = document.getElementById('auditList');
      const res = await fetch('/api/audit', {
        headers: { 'x-user-role': currentRole }
      });
      const data = await res.json();
      list.innerHTML = "";
      
      if (res.ok && data.logs) {
        data.logs.forEach(log => {
          const li = document.createElement('li');
          li.innerText = `[${log.timestamp}] [${log.auditor}] ${log.status}: ${log.detail}`;
          list.appendChild(li);
        });
      } else {
        list.innerHTML = `<li style="color:red;">${data.error}</li>`;
      }
    }

    async function enviarMensaje() {
      const message = document.getElementById('msgInput').value;
      const statusDiv = document.getElementById('msgStatus');

      const res = await fetch('/api/support/message', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user: currentRole, message })
      });

      const data = await res.json();
      if (res.ok) {
        statusDiv.style.color = '#4caf50';
        statusDiv.innerText = "✓ " + data.message;
        document.getElementById('msgInput').value = '';
      } else {
        statusDiv.style.color = '#f44336';
        statusDiv.innerText = "❌ " + data.error;
      }
    }

    cambiarRol();
    cargarConfig();
  </script>
</body>
</html>
