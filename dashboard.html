<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gus Gus - Panel Principal</title>
  <style>
    :root {
      --bg-color: #F4EFEA;
      --card-bg: #FFFFFF;
      --primary-color: #3A272D;
      --primary-hover: #2B1C21;
      --accent-color: #8C6551;
      --text-main: #231B1E;
      --text-muted: #6E6366;
      --border-color: #E2DAD5;
      --success-bg: #EAF4EE;
      --success-text: #3A7A56;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px 16px;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    /* Barra Superior / Header */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 16px 20px;
      border-radius: 20px;
      border: 1px solid rgba(226, 218, 213, 0.6);
      box-shadow: 0 4px 20px rgba(58, 39, 45, 0.03);
      margin-bottom: 20px;
    }

    .brand-logo {
      font-size: 22px;
      font-weight: 700;
      color: var(--primary-color);
      letter-spacing: -0.5px;
    }

    .btn-logout {
      background: transparent;
      border: 1.5px solid var(--accent-color);
      color: var(--accent-color);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-logout:active {
      background: var(--accent-color);
      color: #FFFFFF;
    }

    /* Tarjeta de Bienvenida (Primera Fila) */
    .welcome-card {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 20px;
      border: 1px solid rgba(226, 218, 213, 0.6);
      box-shadow: 0 8px 24px rgba(58, 39, 45, 0.04);
      margin-bottom: 20px;
    }

    .welcome-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .welcome-title {
      color: var(--primary-color);
      font-size: 22px;
      font-weight: 700;
    }

    .status-badge {
      padding: 6px 12px;
      background: var(--success-bg);
      color: var(--success-text);
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .user-details {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .user-details strong {
      color: var(--text-main);
    }

    /* Fila de Métricas / Accesos Rápidos */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: var(--card-bg);
      padding: 18px 16px;
      border-radius: 16px;
      border: 1px solid rgba(226, 218, 213, 0.6);
      text-align: left;
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: var(--primary-color);
    }

    /* Lista de Operaciones Recientes */
    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary-color);
      margin-bottom: 12px;
    }

    .activity-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 20px;
      border: 1px solid rgba(226, 218, 213, 0.6);
      text-align: center;
    }

    .empty-state-text {
      font-size: 13px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Navegación -->
    <nav class="navbar">
      <div class="brand-logo">Gus Gus</div>
      <button class="btn-logout" id="btnLogout">Cerrar Sesión</button>
    </nav>

    <!-- Fila 1: Tarjeta de Bienvenida y Usuario -->
    <div class="welcome-card">
      <div class="welcome-header">
        <h2 class="welcome-title" id="userGreeting">¡Hola!</h2>
        <span class="status-badge">ACTIVO</span>
      </div>
      <div class="user-details" id="userInfo">
        Cargando perfil...
      </div>
    </div>

    <!-- Fila 2: Resumen de Estado -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Operaciones</div>
        <div class="stat-value">0 activas</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Nivel de Seguridad</div>
        <div class="stat-value" style="color: var(--accent-color);">Alto</div>
      </div>
    </div>

    <!-- Fila 3: Actividad Reciente -->
    <h3 class="section-title">Actividad Reciente</h3>
    <div class="activity-card">
      <p class="empty-state-text">No hay movimientos o transacciones recientes.</p>
    </div>
  </div>

  <script>
    // Validar sesión
    const user = JSON.parse(localStorage.getItem('gusgus_user') || '{}');
    const token = localStorage.getItem('gusgus_token');

    if (!token && !user.email) {
      window.location.href = '/';
    } else {
      document.getElementById('userGreeting').textContent = `¡Hola, ${user.nombre || 'Usuario'}!`;
      document.getElementById('userInfo').innerHTML = `
        <p><strong>Correo:</strong> ${user.email || 'No registrado'}</p>
        <p><strong>DNI:</strong> ${user.dni || 'No registrado'}</p>
      `;
    }

    // Cerrar Sesión
    document.getElementById('btnLogout').onclick = function() {
      localStorage.removeItem('gusgus_token');
      localStorage.removeItem('gusgus_user');
      window.location.href = '/';
    };
  </script>

</body>
</html>
