<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gus Gus - Dashboard</title>
  <style>
    :root {
      --bg-color: #0F172A;
      --card-bg: #1E293B;
      --primary-cyan: #06B6D4;
      --accent-purple: #8B5CF6;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --border-color: #334155;
      --input-bg: #0F172A;
      --success: #10B981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 14px 18px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      margin-bottom: 16px;
    }

    .brand-logo-small {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-gg {
      background: linear-gradient(135deg, var(--primary-cyan), var(--accent-purple));
      color: white;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 14px;
    }

    .btn-logout {
      background: transparent;
      border: 1px solid var(--accent-purple);
      color: var(--accent-purple);
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .card {
      background: var(--card-bg);
      padding: 18px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--primary-cyan);
      margin-bottom: 12px;
    }

    .form-group {
      margin-bottom: 12px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--text-muted);
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 14px;
      color: #FFF;
      outline: none;
    }

    .role-selector {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .btn-role {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--border-color);
      background: var(--input-bg);
      border-radius: 12px;
      font-weight: 700;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .btn-role.active {
      border-color: var(--primary-cyan);
      background: linear-gradient(135deg, var(--primary-cyan), var(--accent-purple));
      color: #FFF;
    }

    .btn-main {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary-cyan), var(--accent-purple));
      color: #FFF;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    .chat-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-card-item {
      background: var(--input-bg);
      padding: 14px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-card-item.active {
      border-color: var(--primary-cyan);
    }

    .chat-box {
      height: 300px;
      overflow-y: auto;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }

    .msg {
      max-width: 85%;
      padding: 10px 12px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .msg.sistema {
      background: #1E293B;
      color: var(--primary-cyan);
      align-self: center;
      text-align: center;
      font-weight: 600;
      border: 1px solid var(--border-color);
      max-width: 95%;
    }

    .msg.propio {
      background: var(--accent-purple);
      color: #FFF;
      align-self: flex-end;
    }

    .msg.contraparte {
      background: #334155;
      color: var(--text-main);
      align-self: flex-start;
    }

    .msg img {
      width: 100%;
      max-height: 180px;
      object-fit: cover;
      border-radius: 8px;
      margin-top: 6px;
    }

    .chat-controls {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn-action-chat {
      flex: 1;
      padding: 10px;
      background: var(--accent-purple);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }

    .report-box {
      background: var(--input-bg);
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      margin-top: 10px;
      border: 1px solid var(--border-color);
    }

    .oculto { display: none !important; }

    #mensajeGlobal {
      font-size: 13px;
      font-weight: 600;
      margin-top: 10px;
    }
    .exito { color: var(--success); }
    .error { color: #EF4444; }
  </style>
</head>
<body>

  <div class="container">
    <nav class="navbar">
      <div class="brand-logo-small">
        <span class="badge-gg">GG</span>
        <strong style="font-size:18px;">Gus Gus</strong>
      </div>
      <button class="btn-logout" id="btnLogout">Cerrar Sesión</button>
    </nav>

    <!-- REPORTES FINANCIEROS IA -->
    <div class="card">
      <h3 class="section-title">📊 Reporte Financiero IA</h3>
      <button type="button" class="btn-main" id="btnObtenerReporte" style="font-size:12px; padding:10px;">Consultar Ventas y Ganancias</button>
      <div id="vistaReporte" class="report-box oculto"></div>
    </div>

    <!-- INICIAR ACUERDO SEGURO -->
    <div class="card">
      <h3 class="section-title">Crear Acuerdo Seguro</h3>
      <form id="formCrearOp">
        <label style="font-size: 12px; font-weight: 600; color:var(--text-muted);">Tu rol en la operación:</label>
        <div class="role-selector">
          <button type="button" class="btn-role active" id="btnRolVendedor">Soy Vendedor</button>
          <button type="button" class="btn-role" id="btnRolComprador">Soy Comprador</button>
        </div>

        <div class="form-group">
          <label>Monto del Producto/Servicio (S/)</label>
          <input type="number" id="opMonto" placeholder="Ej. 150.00" step="0.01" required>
        </div>

        <div class="form-group">
          <label>Correo de la Contraparte (Opcional)</label>
          <input type="email" id="opContraparte" placeholder="cliente@correo.com">
        </div>

        <div class="form-group">
          <label>Descripción del Producto/Servicio</label>
          <input type="text" id="opDescripcion" placeholder="Ej. Zapatillas / Producto" required>
        </div>

        <div class="form-group">
          <label>Foto del Producto (Vendedor)</label>
          <input type="file" id="opFotoProducto" accept="image/*" style="color:var(--text-muted);">
        </div>

        <button type="submit" class="btn-main">Crear Chat de Custodia</button>
      </form>
    </div>

    <!-- SECCIÓN MULTICHAT -->
    <div class="card">
      <h3 class="section-title">Mis Chats de Intermediación</h3>
      <div id="listaMultichats" class="chat-list">
        <p style="font-size: 13px; color: var(--text-muted); text-align: center;">No tienes chats abiertos.</p>
      </div>
    </div>

    <!-- CHAT ACTIVO -->
    <div class="card oculto" id="seccionChatActivo">
      <h3 class="section-title" id="chatTitulo">Chat de Custodia</h3>
      
      <div class="chat-box" id="boxMensajes"></div>

      <div class="chat-controls">
        <button type="button" class="btn-action-chat" id="btnDepositarCustodia" style="background: #10B981;">🟢 Confirmar Depósito</button>
        <label class="btn-action-chat" style="background: var(--primary-cyan); display: inline-block;">
          📷 Foto Envío
          <input type="file" id="inputFotoEnvio" accept="image/*" class="oculto">
        </label>
        <label class="btn-action-chat" style="background: var(--accent-purple); display: inline-block;">
          ✅ Foto Recepción
          <input type="file" id="inputFotoRecepcion" accept="image/*" class="oculto">
        </label>
      </div>

      <div style="display: flex; gap: 6px; margin-top: 10px;">
        <input type="text" id="txtMensajeChat" placeholder="Escribe un mensaje..." style="flex:1; padding:10px; border-radius:10px; border:1px solid var(--border-color); background:var(--input-bg); color:#FFF; outline:none;">
        <button type="button" id="btnEnviarMensaje" class="btn-main" style="width: auto; padding: 10px 16px;">Enviar</button>
      </div>
    </div>

    <div id="mensajeGlobal"></div>
  </div>

  <script>
    const user = JSON.parse(localStorage.getItem('gusgus_user') || '{}');
    const token = localStorage.getItem('gusgus_token');
    let rolSeleccionado = 'VENTA';
    let codigoOpActiva = null;
    let base64FotoProducto = null;

    if (!token && !user.email) window.location.href = '/';

    const btnVendedor = document.getElementById('btnRolVendedor');
    const btnComprador = document.getElementById('btnRolComprador');

    btnVendedor.onclick = () => {
      rolSeleccionado = 'VENTA';
      btnVendedor.classList.add('active');
      btnComprador.classList.remove('active');
    };

    btnComprador.onclick = () => {
      rolSeleccionado = 'COMPRA';
      btnComprador.classList.add('active');
      btnVendedor.classList.remove('active');
    };

    document.getElementById('opFotoProducto').onchange = function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => { base64FotoProducto = evt.target.result; };
        reader.readAsDataURL(file);
      }
    };

    document.getElementById('formCrearOp').onsubmit = async function(e) {
      e.preventDefault();
      const msg = document.getElementById('mensajeGlobal');
      msg.textContent = "Creando acuerdo...";

      try {
        const res = await fetch('/api/operaciones/crear', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: user.email,
            contraparteEmail: document.getElementById('opContraparte').value,
            rol: rolSeleccionado,
            monto: document.getElementById('opMonto').value,
            descripcion: document.getElementById('opDescripcion').value,
            fotoProducto: base64FotoProducto
          })
        });
        const data = await res.json();
        
        msg.textContent = "¡Chat de intermediación iniciado!";
        msg.className = "exito";
        
        document.getElementById('formCrearOp').reset();
        cargarMultichats();
      } catch (err) {
        msg.textContent = "Error al crear operación.";
        msg.className = "error";
      }
    };

    async function cargarMultichats() {
      try {
        const res = await fetch(`/api/operaciones/usuario/${user.email}`);
        const data = await res.json();
        const lista = document.getElementById('listaMultichats');

        if (!data.operaciones || data.operaciones.length === 0) {
          lista.innerHTML = '<p style="font-size: 13px; color: var(--text-muted); text-align: center;">No tienes chats abiertos.</p>';
          return;
        }

        lista.innerHTML = data.operaciones.map(op => `
          <div class="chat-card-item ${op.codigoOp === codigoOpActiva ? 'active' : ''}" onclick="abrirChat('${op.codigoOp}')">
            <div>
              <strong style="color: var(--primary-cyan);">${op.codigoOp}</strong>
              <div style="font-size: 13px; color: var(--text-main); font-weight:600;">${op.descripcion}</div>
              <div style="font-size: 12px; color: var(--text-muted);">S/ ${op.montoBase} (${op.estado})</div>
            </div>
            <span style="font-size: 11px; background: #334155; color: var(--primary-cyan); padding:4px 8px; border-radius:8px; font-weight:700;">
              ${op.estado}
            </span>
          </div>
        `).join('');
      } catch (err) {}
    }

    window.abrirChat = async function(codigoOp) {
      codigoOpActiva = codigoOp;
      document.getElementById('seccionChatActivo').classList.remove('oculto');
      document.getElementById('chatTitulo').textContent = `Chat de Custodia ${codigoOp}`;
      await actualizarChat();
      cargarMultichats();
    };

    async function actualizarChat() {
      if (!codigoOpActiva) return;
      try {
        const res = await fetch(`/api/operaciones/${codigoOpActiva}`);
        const data = await res.json();
        const box = document.getElementById('boxMensajes');

        box.innerHTML = data.chat.map(m => {
          let clase = 'sistema';
          if (m.tipo === 'usuario') {
            clase = m.remitente === user.email ? 'propio' : 'contraparte';
          }
          return `
            <div class="msg ${clase}">
              <div>${m.texto}</div>
              ${m.foto ? `<img src="${m.foto}" />` : ''}
              <div style="font-size:10px; opacity:0.7; text-align:right; margin-top:4px;">${m.fecha}</div>
            </div>
          `;
        }).join('');

        box.scrollTop = box.scrollHeight;
      } catch (err) {}
    }

    document.getElementById('btnEnviarMensaje').onclick = async function() {
      const txt = document.getElementById('txtMensajeChat').value;
      if (!txt || !codigoOpActiva) return;

      await fetch(`/api/operaciones/${codigoOpActiva}/mensaje`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ remitente: user.email, texto: txt })
      });

      document.getElementById('txtMensajeChat').value = '';
      actualizarChat();
    };

    document.getElementById('btnDepositarCustodia').onclick = async function() {
      if (!codigoOpActiva) return;
      await fetch(`/api/operaciones/${codigoOpActiva}/depositar`, { method: 'POST' });
      actualizarChat();
    };

    document.getElementById('inputFotoEnvio').onchange = function(e) {
      const file = e.target.files[0];
      if (file && codigoOpActiva) {
        const reader = new FileReader();
        reader.onload = async (evt) => {
          await fetch(`/api/operaciones/${codigoOpActiva}/mensaje`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ remitente: user.email, foto: evt.target.result, tipoAccion: 'SUBIR_ENVIO' })
          });
          actualizarChat();
        };
        reader.readAsDataURL(file);
      }
    };

    document.getElementById('inputFotoRecepcion').onchange = function(e) {
      const file = e.target.files[0];
      if (file && codigoOpActiva) {
        const reader = new FileReader();
        reader.onload = async (evt) => {
          await fetch(`/api/operaciones/${codigoOpActiva}/mensaje`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ remitente: user.email, foto: evt.target.result, tipoAccion: 'SUBIR_RECEPCION' })
          });
          actualizarChat();
        };
        reader.readAsDataURL(file);
      }
    };

    document.getElementById('btnObtenerReporte').onclick = async function() {
      const vista = document.getElementById('vistaReporte');
      try {
        const res = await fetch(`/api/reportes/usuario/${user.email}`);
        const data = await res.json();
        
        vista.classList.remove('oculto');
        vista.innerHTML = `
          <strong>${data.titulo}</strong><br>
          💰 Ventas Totales: ${data.ventasTotales}<br>
          🛒 Compras Totales: ${data.comprasTotales}<br>
          🤝 Comisiones Aportadas: ${data.comisionesAportadas}
        `;
      } catch (err) {}
    };

    document.getElementById('btnLogout').onclick = function() {
      localStorage.clear();
      window.location.href = '/';
    };

    cargarMultichats();
  </script>
</body>
</html>
