<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gus Gus - Panel Principal</title>
  <style>
    :root {
      --bg-color: #F4EFEA;
      --card-bg: #FFFFFF;
      --primary-color: #3A272D;
      --accent-color: #8C6551;
      --text-main: #231B1E;
      --text-muted: #6E6366;
      --border-color: #E2DAD5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 16px 24px;
      border-radius: 18px;
      border: 1px solid rgba(226, 218, 213, 0.6);
      margin-bottom: 24px;
    }

    .brand-logo {
      font-size: 22px;
      font-weight: 700;
      color: var(--primary-color);
    }

    .btn-logout {
      background: transparent;
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      padding: 8px 16px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    .welcome-card {
      background: var(--card-bg);
      padding: 28px;
      border-radius: 20px;
      border: 1px solid rgba(226, 218, 213, 0.6);
      box-shadow: 0 10px 30px rgba(58, 39, 45, 0.04);
      margin-bottom: 20px;
    }

    .welcome-card h2 {
      color: var(--primary-color);
      font-size: 22px;
      margin-bottom: 8px;
    }

    .welcome-card p {
      color: var(--text-muted);
      font-size: 14px;
    }

    .status-badge {
      display: inline-block;
      margin-top: 14px;
      padding: 6px 12px;
      background: #EAF4EE;
      color: #3A7A56;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="container">
    <nav class="navbar">
      <div class="brand-logo">Gus Gus</div>
      <button class="btn-logout" id="btnLogout">Cerrar Sesión</button>
    </nav>

    <div class="welcome-card">
      <h2 id="userGreeting">¡Bienvenido a Gus Gus!</h2>
      <p id="userInfo">Cargando tus datos de usuario...</p>
      <div class="status-badge">Cuenta Verificada & Inmune</div>
    </div>
  </div>

  <script>
    // Recuperar token e información del usuario guardada en el navegador
    const user = JSON.parse(localStorage.getItem('gusgus_user') || '{}');
    const token = localStorage.getItem('gusgus_token');

    if (!token && !user.email) {
      window.location.href = '/';
    } else {
      document.getElementById('userGreeting').textContent = `¡Hola, ${user.nombre || 'Usuario'}!`;
      document.getElementById('userInfo').textContent = `Correo: ${user.email} | DNI: ${user.dni}`;
    }

    document.getElementById('btnLogout').onclick = function() {
      localStorage.removeItem('gusgus_token');
      localStorage.removeItem('gusgus_user');
      window.location.href = '/';
    };
  </script>

</body>
</html>
